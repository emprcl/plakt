<style>
/* CLASS LEGEND — the chrome uses short names; here's what they are:
   layout   .cr common chrome (fades in edit mode) · #rail tools · #panel
            inspector · #status footer
   panel    .sec section · .sh section heading · .r field row · .lb label ·
            .n numeric field (drag to scrub) · .tip helper text · .u unit
   swatches .sw palette row · .swn name field · .swx delete · .ch colour chip
   fill     .tint tint button · .fw/.f/.fx font row/button/remove · .alb
            small toggle button (align, add)
   layers   .ly layer row · .tab/.tabs inspector tabs
   canvas   .o an object node · .hd resize/rotate handle · .sel-o/.sel-i
            selection outline · .gd/.gh guide line/hit-target · .rul ruler
   palette (command bar): .c command row · .k keyboard hint            */
:root{
  --ink:#e9e9e7; --dim:#8d8d8a; --faint:#575755;
  --chrome:#111110; --chrome2:#1c1c1a; --field:#b3b3b0;
  --hair:rgba(233,233,231,.14);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --t:170ms cubic-bezier(.4,0,.2,1);
  --rail:112px; --pan:272px; --stat:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--field);font:11px/1.4 var(--mono);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;border-radius:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:1px}

#stage{position:fixed;inset:0;display:grid;place-items:center;padding:0;transition:padding var(--t)}
body.edit #stage{padding:0 var(--pan) var(--stat) var(--rail)}
#board{position:relative;height:min(90vh,900px);aspect-ratio:var(--ar,3/4);
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 18px 52px rgba(0,0,0,.3);transition:height var(--t)}
body.edit #board{height:min(78vh,820px)}
#board svg{display:block;width:100%;height:100%;user-select:none;touch-action:none}
#guides{opacity:0;pointer-events:none;transition:opacity var(--t)}
body.edit.grid #guides{opacity:1;pointer-events:auto}
.gd{stroke:#12b8d8;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.gd.hot{stroke:#fff;stroke-width:2}
.gh{stroke:#000;stroke-opacity:0;stroke-width:11;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:grab}
.rul{position:absolute;background:var(--chrome);opacity:0;transition:opacity var(--t)}
body.edit.grid .rul{opacity:1}
.rul:hover{background:#2a2a28}
#rulT{left:0;right:0;top:-13px;height:12px;cursor:row-resize}
#rulL{top:0;bottom:0;left:-13px;width:12px;cursor:col-resize}
#gridlines{opacity:0;transition:opacity var(--t)}
body.edit.grid #gridlines{opacity:1}
.sel-o{fill:none;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke;opacity:.45;pointer-events:none}
.sel-i{fill:none;stroke:#000;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.hd{fill:#fff;stroke:#000;stroke-width:1;vector-effect:non-scaling-stroke}
.hd:hover{fill:#000;stroke:#fff}

     Plain JSON, greppable without executing anything. The inline <svg>
     below is generated from it and renders on its own with JS disabled.

     Artboard: w/h in document units (= the @1x PNG size). cols/rows/gap/
     margin describe the module grid, which is a *snapping guide only* —
     nothing in an object references it, so editing the grid never moves
     anything.

     Object geometry is absolute, in document units:
       x, y  top-left corner   (text: x = left edge of the wrap frame,
                                       y = the first baseline)
       w, h  size              (text: w = wrap width, h unused)
       rot   degrees, clockwise; shapes pivot on their centre, text on x,y

     Invariants worth knowing:
       · palette[0] is the background and the colour tints mix toward it;
         slot ids are otherwise just labels — safe to rename.

<script id="app">
"use strict";
/* ════════════════════════════════════════════════════════════════════
   PLAKT — a graphic design tool that is also its own document.

   VOCABULARY (the names are terse; here's the map):
     doc            the document object — the single source of truth
     cur()          the currently selected object, or null
     box(o)         an object's absolute {x,y,w,h}; localBox() is the same
                    but returns the visual ink box for text
     full()         re-render everything (svg + panel + status)
     touch()        mark the doc dirty, then full()
     renderSVG()    rebuild the artboard <svg> from doc
     patch(o)       update one object's svg node in place (no rebuild)
     marks()        draw the selection outline + resize/rotate handles
     panel()        rebuild the right-hand inspector
     wire()         attach listeners to the freshly-rebuilt panel
     sync()/live()  refresh the status line / panel numbers without a rebuild
     commit()       push an undo snapshot before a mutation
     G()            current grid metrics {m,g,cw,rh}
     snapLinesV/H() the lines an object can snap to (margins+grid+guides)
   ═══════════════════════════════════════════════════════════════════ */

const VERSION = '0.1.0';                            /* shown bottom-right */
const EMBEDDED = ['Poppins','Lora','Caladea','Liberation Sans','DejaVu Sans Mono'];
/* Embedded faces travel with the file. Google faces are a deliberate
   exception: they need the network, so they're marked in the picker and
   they will not rasterise into a PNG export offline. */
const fontList = () => EMBEDDED.concat(doc.webfonts || []);
const isWeb = f => (doc.webfonts || []).includes(f);

function linkFont(family){
  const id = 'gf-' + family.replace(/\W+/g,'-').toLowerCase();
  if(document.getElementById(id)) return;
  const l = document.createElement('link');
  l.id = id; l.rel = 'stylesheet'; l.dataset.webfont = family;
  l.href = 'https://fonts.googleapis.com/css2?family=' +
           family.replace(/ /g,'+') + '&display=swap';
  document.head.appendChild(l);
}
function ensureWebfonts(){ (doc.webfonts || []).forEach(linkFont); }

function removeWebfont(family){
  commit();
  doc.webfonts = (doc.webfonts || []).filter(f => f !== family);
  const el = document.getElementById('gf-' + family.replace(/\W+/g,'-').toLowerCase());
  if(el) el.remove();
  doc.objects.forEach(o => { if(o.font === family) o.font = EMBEDDED[0]; });
  touch(); flash(family + ' removed');
}

async function addWebfont(raw){
  const family = String(raw).trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  if(!family) return;
  if(fontList().includes(family)) return flash(family + ' is already listed');
  linkFont(family);
  flash('loading ' + family + '…');
  try{
    await document.fonts.load(`16px "${family}"`);
    if(!document.fonts.check(`16px "${family}"`)) throw 0;
  }catch(e){
    const el = document.getElementById('gf-' + family.replace(/\W+/g,'-').toLowerCase());
    if(el) el.remove();
    return flash(`no Google font called “${family}”`);
  }
  commit();
  doc.webfonts = (doc.webfonts || []).concat(family);
  const o = cur(); if(o && o.type === 'text') o.font = family;
  touch(); flash(family + ' added');
}
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let doc     = JSON.parse($('#doc-data').textContent);
let sel     = null, dirty = false, snap = true, drag = null, handle = null;
let undoS   = [], redoS = [];
const svgEl = $('#doc-svg');
const CAN_WRITE = 'showSaveFilePicker' in window;
const nextId = () => doc.objects.reduce((m,o) => Math.max(m,o.id), 0) + 1;

/* ════════════════════════════════════════════════════════════════════
   GEOMETRY — objects live in absolute document units (x, y, w, h).
   The grid (cols/rows/gap/margin) is a *snapping guide*, not a coordinate
   system: it lines things up but never stores or moves anything. Changing
   the grid can't shift an object, because no object references it. G()
   gives the column/row metrics used to draw the grid overlay and to
   generate snap lines.
   For text: x is the left edge of the wrap frame, y is the first baseline,
   w is the wrap width (h is unused — text height derives from the copy).
   ═══════════════════════════════════════════════════════════════════ */
function G(){
  const m = doc.margin||0, g = doc.gap||0;
  return {
    m, g,
    cw: (doc.w - 2*m - (doc.cols-1)*g) / doc.cols,
    rh: (doc.h - 2*m - (doc.rows-1)*g) / doc.rows
  };
}
const box = o => ({ x: o.x, y: o.y, w: o.w, h: o.h });
function setPos(o, x, y){ o.x = Math.round(x*100)/100; o.y = Math.round(y*100)/100; }

/* ── snap lines ──────────────────────────────────────────────────────
   One pool of vertical / horizontal lines an object can reach for: the
   margins, every column/row edge, and the free guides. Grid and guides
   are the same mechanism now — both just contribute lines here. */
const guides = () => (doc.guides = doc.guides || {v:[], h:[]});
function snapLinesV(){
  const {m,g,cw} = G(), out = [m, doc.w - m, ...guides().v];
  if(doc.cols > 1) for(let c=0;c<doc.cols;c++){ const l = m + c*(cw+g); out.push(l, l+cw); }
  return out;
}
function snapLinesH(){
  const {m,g,rh} = G(), out = [m, doc.h - m, ...guides().h];
  if(doc.rows > 1) for(let r=0;r<doc.rows;r++){ const t = m + r*(rh+g); out.push(t, t+rh); }
  return out;
}
let snapG = { v:null, h:null };
const SNAPTOL = () => {
  const bw = document.getElementById('board').clientWidth || doc.w;
  return 7 * (doc.w / bw);                       /* ~7 screen px, whatever the zoom */
};
/* snap a moving box: leading edge, centre and trailing edge each reach for
   a line; the nearest within tolerance wins and is flagged for the hot
   highlight. Manual guides light up; grid edges snap silently. */
function snapToGuides(x, y, w, h){
  const tol = SNAPTOL(), V = snapLinesV(), H = snapLinesH(), gu = guides();
  snapG = { v:null, h:null };
  let best = tol, hit = null;
  [0, w/2, w].forEach(off => V.forEach(gx => {
    const d = Math.abs(x + off - gx);
    if(d < best){ best = d; hit = gx - off; snapG.v = gu.v.includes(gx) ? gx : null; }
  }));
  if(hit !== null) x = hit;
  best = tol; hit = null;
  [0, h/2, h].forEach(off => H.forEach(gy => {
    const d = Math.abs(y + off - gy);
    if(d < best){ best = d; hit = gy - off; snapG.h = gu.h.includes(gy) ? gy : null; }
  }));
  if(hit !== null) y = hit;
  return [x, y];
}
/* snap a single coordinate to the nearest line within tolerance (used
   while scaling); returns its input unchanged when nothing is close. */
const snapV = x => { let best = SNAPTOL(), hit = x; snapLinesV().forEach(g => { const d = Math.abs(x-g); if(d < best){ best = d; hit = g; } }); return hit; };
const snapH = y => { let best = SNAPTOL(), hit = y; snapLinesH().forEach(g => { const d = Math.abs(y-g); if(d < best){ best = d; hit = g; } }); return hit; };
/* nearest line unconditionally — for the "snap selection to grid" command */
const nearest = (arr, v) => arr.reduce((a,b) => Math.abs(b-v) < Math.abs(a-v) ? b : a, v);
const unit = () => Math.max(doc.w, doc.h)/70;      // handle size in doc units

/* ── colour ──────────────────────────────────────────────────────────
   Slot ids are just labels — nothing in the code depends on a name. Two
   roles are held *by position*: palette[0] is the artboard background and
   the colour tints mix toward; a new object defaults to the first non-
   background slot. So renaming any swatch is always safe. */
const slotHex = id => (doc.palette.find(p => p.id === id) || {hex:'#000000'}).hex;
const bg = () => doc.palette[0] || {hex:'#ffffff'};
const defaultFill = () => (doc.palette.find((p,i) => i > 0) || doc.palette[0] || {id:'INK'}).id;
function mix(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b);
  const c = (x,y) => Math.round(x + (y-x)*t).toString(16).padStart(2,'0');
  return '#' + c(r1,r2) + c(g1,g2) + c(b1,b2);
}
function fillHex(f){
  const [id, pct] = String(f).split('@');
  return pct ? mix(bg().hex, slotHex(id), +pct/100) : slotHex(id);
}
const fillSlot = f => String(f).split('@')[0];
const fillPct  = f => { const p = String(f).split('@')[1]; return p ? +p : 100; };

/* ── history ─────────────────────────────────────────────────────── */
const snapshot = () => JSON.stringify(doc);
function commit(){ undoS.push(snapshot()); if(undoS.length > 80) undoS.shift(); redoS = []; }
function undo(){
  if(!undoS.length) return flash('nothing to undo');
  redoS.push(snapshot()); doc = JSON.parse(undoS.pop());
  sel = doc.objects.some(o => o.id === sel) ? sel : null; dirty = true; full();
}
function redo(){
  if(!redoS.length) return flash('nothing to redo');
  undoS.push(snapshot()); doc = JSON.parse(redoS.pop()); dirty = true; full();
}

/* ════════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════ */
/* safe for both text nodes and quoted attribute values — the document can
   arrive from someone else, so treat every string in it as untrusted */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* a font family dropped into a CSS/SVG font-family — strip the characters
   that could break out of the quoted value */
const cssFont = f => `"${String(f).replace(/["\\<>]/g,'')}", sans-serif`;

/* rotation pivots: shapes about their centre, text about its anchor */
function pivot(o){
  if(o.type === 'text') return { x: o.x, y: o.y };
  const b = box(o); return { x: b.x + b.w/2, y: b.y + b.h/2 };
}
function rotAttr(o){
  if(!o.rot) return '';
  const p = pivot(o);
  return ` transform="rotate(${o.rot} ${p.x} ${p.y})"`;
}

function shapeSVG(o){
  const b = box(o), a = `class="o" data-id="${o.id}" fill="${fillHex(o.fill)}"`, t = rotAttr(o);
  switch(o.type){
    case 'ellipse':
      return `<ellipse ${a}${t} cx="${b.x+b.w/2}" cy="${b.y+b.h/2}" rx="${b.w/2}" ry="${b.h/2}"/>`;
    case 'half':
      return `<path ${a}${t} d="M ${b.x} ${b.y+b.h} A ${b.w/2} ${b.h} 0 0 1 ${b.x+b.w} ${b.y+b.h} Z"/>`;
    case 'text': {
      const {anchor, x} = textAnchor(o), lh = LH(o);
      const sp = wrapLines(o).map((l,i) =>
        `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('');
      return `<text ${a}${t} x="${x}" y="${o.y}" text-anchor="${anchor}" font-family="${cssFont(o.font)}" font-weight="${o.wt||400}" font-size="${o.size}" letter-spacing="${o.tr||0}">${sp}</text>`;
    }
    default:
      return `<rect ${a}${t} x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
  }
}

function guidesSVG(){
  const g = guides(), s = [];
  g.v.forEach((x,i) => s.push(
    `<line class="gd${snapG.v===x?' hot':''}" x1="${x}" y1="0" x2="${x}" y2="${doc.h}"/>`,
    `<line class="gh" data-gv="${i}" x1="${x}" y1="0" x2="${x}" y2="${doc.h}"/>`));
  g.h.forEach((y,i) => s.push(
    `<line class="gd${snapG.h===y?' hot':''}" x1="0" y1="${y}" x2="${doc.w}" y2="${y}"/>`,
    `<line class="gh" data-gh="${i}" x1="0" y1="${y}" x2="${doc.w}" y2="${y}"/>`));
  return s.join('');
}

function gridSVG(){
  const {m,g,cw,rh} = G();
  let s = '';
  if(doc.cols > 1) for(let c=0;c<doc.cols;c++) s += `<rect x="${m+c*(cw+g)}" y="${m}" width="${cw}" height="${doc.h-2*m}"/>`;
  if(doc.rows > 1) for(let r=0;r<doc.rows;r++) s += `<rect x="${m}" y="${m+r*(rh+g)}" width="${doc.w-2*m}" height="${rh}"/>`;
  return s;
}

/* Text metrics without waiting on the DOM. getBBox is only valid once the
   browser has laid the text out, which is a frame late and empty while a
   webfont swaps; canvas measureText answers immediately and agrees. */
const MC = document.createElement('canvas').getContext('2d');

/* leading in pixels; 0 (or unset) means auto — track 1.2× the size */
const LH = o => o.lh > 0 ? o.lh : Math.round(1.2 * o.size);
const ALIGN = { l:['start', 0], c:['middle', .5], r:['end', 1] };

/* The frame constrains the copy: text wraps to the box width, so widening
   the box re-flows the lines instead of rescaling the type. */
function wrapLines(o){
  const max = o.w;
  MC.font = `${o.wt||400} ${o.size}px ${cssFont(o.font)}`;
  const tw = s => MC.measureText(s).width + (o.tr||0) * Math.max(0, s.length - 1);
  const out = [];
  String(o.str).split('\n').forEach(para => {
    if(!para.trim()){ out.push(''); return; }
    let line = '';
    para.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if(line && tw(t) > max){ out.push(line); line = word; } else line = t;
    });
    out.push(line);
  });
  return out.length ? out : [''];
}
function textAnchor(o){
  const [anchor, f] = ALIGN[o.al || 'l'];
  return { anchor, x: o.x + o.w * f };
}
function textBox(o){
  const lines = wrapLines(o), lh = LH(o), asc = o.size * .78;
  return {
    x: o.x,
    y: o.y - asc,
    w: o.w,
    h: asc + lh * (lines.length - 1) + o.size * .26
  };
}

const NS = 'http://www.w3.org/2000/svg';

/* <text> only hit-tests on painted glyphs, so a click between letters falls
   through. Lay a transparent rect over each text block's real ink box. */
function textHits(){
  doc.objects.forEach(o => {
    if(o.type !== 'text') return;
    const el = svgEl.querySelector(`[data-id="${o.id}"]`); if(!el) return;
    const b = textBox(o), p = unit()*0.3, r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', b.x - p);     r.setAttribute('y', b.y - p);
    r.setAttribute('width',  b.w + p*2);
    r.setAttribute('height', b.h + p*2);
    r.setAttribute('fill', '#000');   r.setAttribute('fill-opacity', '0');
    r.setAttribute('pointer-events', 'all');
    r.setAttribute('class', 'o');     r.setAttribute('data-hit', o.id);
    const t = el.getAttribute('transform'); if(t) r.setAttribute('transform', t);
    el.parentNode.insertBefore(r, el);
  });
}

function renderSVG(){
  svgEl.setAttribute('viewBox', `0 0 ${doc.w} ${doc.h}`);
  $('#board').style.setProperty('--ar', `${doc.w}/${doc.h}`);
  svgEl.innerHTML =
    `<rect id="bg" width="${doc.w}" height="${doc.h}" fill="${bg().hex}"/>` +
    `<g id="gridlines" fill="#ff2e88" fill-opacity=".16">${gridSVG()}</g>` +
    doc.objects.map(shapeSVG).join('') +
    `<g id="guides">${guidesSVG()}</g>` +
    `<g id="handles"></g>`;
  textHits();
  marks();
}

/* patch one object in place — never rebuild the DOM mid-interaction */
function patch(o){
  const el = svgEl.querySelector(`[data-id="${o.id}"]`); if(!el) return;
  const b = box(o), t = rotAttr(o).replace(/^ transform="|"$/g,'');
  t ? el.setAttribute('transform', t) : el.removeAttribute('transform');
  if(o.type === 'ellipse'){
    el.setAttribute('cx', b.x+b.w/2); el.setAttribute('cy', b.y+b.h/2);
    el.setAttribute('rx', b.w/2);     el.setAttribute('ry', b.h/2);
  } else if(o.type === 'half'){
    el.setAttribute('d', `M ${b.x} ${b.y+b.h} A ${b.w/2} ${b.h} 0 0 1 ${b.x+b.w} ${b.y+b.h} Z`);
  } else if(o.type === 'text'){
    const {anchor, x} = textAnchor(o), lh = LH(o);
    el.setAttribute('x', x); el.setAttribute('y', o.y);
    el.setAttribute('text-anchor', anchor); el.setAttribute('font-size', o.size);
    el.innerHTML = wrapLines(o).map((l,i) =>
      `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('');
  } else {
    el.setAttribute('x', b.x); el.setAttribute('y', b.y);
    el.setAttribute('width', b.w); el.setAttribute('height', b.h);
  }
}

/* ── selection + transform handles ───────────────────────────────── */
function localBox(o){
  return o.type === 'text' ? textBox(o) : box(o);
}

function marks(){
  const h = $('#handles'); if(!h) return;
  h.innerHTML = '';
  const o = cur();
  if(!o || !document.body.classList.contains('edit')) return;
  const b = localBox(o);
  if(!(b.w > 0) || !(b.h > 0)) return;
  const t = rotAttr(o), u = unit(), s = u*0.6;
  const cs = [['nw',b.x,b.y],['ne',b.x+b.w,b.y],['se',b.x+b.w,b.y+b.h],['sw',b.x,b.y+b.h]];
  const rx = b.x + b.w/2, ry = b.y - u*2.2;
  h.innerHTML = `<g${t}>
    <rect class="sel-o" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
    <rect class="sel-i" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
    <line class="hd-l" x1="${rx}" y1="${b.y}" x2="${rx}" y2="${ry}"/>
    ${cs.map(([k,x,y]) => `<rect class="hd" data-h="${k}" x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}"
        style="cursor:${k==='nw'||k==='se'?'nwse':'nesw'}-resize"/>`).join('')}
    <circle class="hd" data-h="rot" cx="${rx}" cy="${ry}" r="${s*1.1}" style="cursor:grab"/>
  </g>`;
}

const cur  = () => doc.objects.find(o => o.id === sel) || null;
const full = () => { renderSVG(); panel(); status(); };
const touch = () => { dirty = true; full(); };

/* ════════════════════════════════════════════════════════════════════
   PANEL
   ═══════════════════════════════════════════════════════════════════ */
function num(lb, k, v){
  return `<div class="r"><span class="lb">${lb}</span><input class="n" data-k="${k}" value="${v}"></div>`;
}
/* section heading: label (with an optional "?" help bubble that replaces
   the old always-on tip lines) on the left, optional control on the right */
function secHead(label, help='', right=''){
  const q = help ? `<span class="help" tabindex="0" role="button" aria-label="help">?<span class="ht">${help}</span></span>` : '';
  return `<div class="sh"><span class="shl">${label}${q}</span>${right}</div>`;
}

function objPanel(o){
  const sw = doc.palette.map(s => `
    <button class="sw ${fillSlot(o.fill)===s.id?'on':''}" data-slot="${s.id}">
      <span class="ch" style="background:${s.hex}"></span><span class="nm">${s.id}</span>
    </button>`).join('');
  const pct = fillPct(o.fill);
  const tints = [100,70,40,15].map(t => `
    <button class="tint ${pct===t?'on':''}" data-tint="${t}"
      style="background:${fillHex(fillSlot(o.fill)+(t<100?'@'+t:''))}"><span>${t}</span></button>`).join('');

  const geom = o.type === 'text'
    ? `<div class="sec">${secHead('Text',
         "the frame constrains the copy — widen it to reflow the lines, don't rescale the type",
         `<em>${wrapLines(o).length} line${wrapLines(o).length===1?'':'s'}</em>`)}
         <textarea class="tx" id="tstr" rows="3">${esc(o.str)}</textarea>
         <div class="r" style="margin-top:8px"><span class="lb">ALIGN</span>
           ${['l','c','r'].map(a => `<button class="alb ${(o.al||'l')===a?'on':''}" data-al="${a}">${a.toUpperCase()}</button>`).join('')}
         </div>
         <div class="r" style="margin-top:7px"><span class="lb">SIZE</span><input class="n" data-k="size" value="${o.size}"><span class="u">px</span>
           <span class="lb" style="width:26px;text-align:right">LEAD</span><input class="n" data-k="lh" value="${LH(o)}"><span class="u">px</span></div>
         <div class="r"><span class="lb">WIDTH</span><input class="n" data-k="w" value="${Math.round(o.w)}"><span class="u">px</span>
           <span class="lb" style="width:26px;text-align:right">TRK</span><input class="n" data-k="tr" value="${o.tr||0}"></div>
         <div class="r"><span class="lb">WGHT</span><input class="n" data-k="wt" value="${o.wt||400}">
           <span class="lb" style="width:26px;text-align:right">ROT</span><input class="n" data-k="rot" value="${o.rot||0}"></div>
       </div>
       <div class="sec">${secHead('Typeface',
         "Google faces are fetched over the network — the file stops being self-contained and they won't rasterise into a PNG offline")}<div class="fs">
         ${fontList().map(f => {
           const ok = !document.fonts || document.fonts.check(`16px "${f}"`);
           const tagged = !ok ? 'NOT LOADED' : isWeb(f) ? 'WEB' : (o.font===f ? '●' : '');
           return `<div class="fw">
             <button class="f ${o.font===f?'on':''}" data-font="${esc(f)}" style="font-family:${cssFont(f)}">${esc(f)}<i>${tagged}</i></button>
             ${isWeb(f) ? `<button class="fx" data-rm="${esc(f)}" title="remove">×</button>` : ''}
           </div>`;
         }).join('')}
       </div>
       <div class="r" style="margin-top:8px">
         <input class="tx" id="gfont" list="gflist" placeholder="add a Google font…" spellcheck="false" autocomplete="off">
         <button class="alb" id="gadd" style="width:auto;padding:5px 10px">ADD</button>
       </div>
       </div>`
    : `<div class="sec">${secHead('Transform',
         'pixels · ROT in degrees · drag a corner on the artboard, or the dot above it to rotate')}
         ${num('W','w',Math.round(o.w))}
         ${num('H','h',Math.round(o.h))}
         ${num('ROT','rot',o.rot||0)}
       </div>`;

  return `
  <div class="sec">
    ${secHead(o.type, 'pixels from the top-left · <b>⌥</b> or <b>ctrl</b> to bypass snapping', `<em>#${o.id}</em>`)}
    ${num('X','x',Math.round(o.x))}
    ${num('Y','y',Math.round(o.y))}
  </div>
  ${geom}
  <div class="sec">
    ${secHead('Fill', 'tints mix toward the <b>background</b> (the first swatch) and stay bound to the slot',
      `<em>${o.fill}</em><button id="forkSw">+ NEW</button>`)}
    ${sw}
    <div class="r" style="margin-top:8px">
      <label class="ch" style="background:${slotHex(fillSlot(o.fill))};cursor:pointer;width:15px;height:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)">
        <input type="color" value="${slotHex(fillSlot(o.fill))}" data-edit="${fillSlot(o.fill)}">
      </label>
      <span class="tip" style="margin:0">edit <b>${fillSlot(o.fill)}</b> — used by ${doc.objects.filter(x => fillSlot(x.fill) === fillSlot(o.fill)).length}</span>
    </div>
    <div class="tints">${tints}</div>
  </div>`;
}

let tab = 'artboard';

function docPanel(){
  if(tab === 'layers'){
    const layers = [...doc.objects].reverse().map(o => `
      <button class="ly ${o.id===sel?'on':''}" data-pick="${o.id}">
        <span class="ch" style="background:${fillHex(o.fill)}"></span>
        <span class="t">${o.type === 'text' ? esc(o.str.split('\n')[0].slice(0,18)) : o.type}</span>
        <span class="x">#${o.id}</span>
      </button>`).join('') || '<div class="tip" style="margin:0">nothing on the artboard yet</div>';
    return `<div class="sec" style="border:0">
      ${secHead('Stack', 'topmost first · <b>[</b> and <b>]</b> reorder the selection', '<em>top first</em>')}${layers}
    </div>`;
  }

  const used = id => doc.objects.filter(o => fillSlot(o.fill) === id).length;
  const sw = doc.palette.map(s => `
    <div class="sw">
      <label class="ch" style="background:${s.hex};cursor:pointer">
        <input type="color" value="${s.hex}" data-edit="${s.id}">
      </label>
      <input class="swn" data-ren="${s.id}" value="${s.id}" maxlength="6" spellcheck="false">
      <span class="ct">${used(s.id)}</span>
      <button class="swx" data-del="${s.id}" title="remove">×</button>
    </div>`).join('');
  const {cw,rh} = G();

  return `
  <div class="sec">
    ${secHead('Artboard', 'pixels — this is exactly the @1x PNG export size')}
    <div class="r"><span class="lb">NAME</span><input class="tx" id="docname" value="${esc(doc.name)}" spellcheck="false"></div>
    <div class="r"><span class="lb">W</span><input class="n" data-k="docw" value="${doc.w}"><span class="u">px</span>
                   <span class="lb" style="width:16px;text-align:right">H</span><input class="n" data-k="doch" value="${doc.h}"><span class="u">px</span></div>
  </div>
  <div class="sec">
    ${secHead('Grid',
      "the grid only guides snapping — it lines things up but never moves what you've placed · set an axis to 1 for no lines there · drag from the strips above and left of the artboard to add guides",
      `<em>${cw.toFixed(1)} × ${rh.toFixed(1)}</em>`)}
    <div class="r"><span class="lb">COLS</span><input class="n" data-k="cols" value="${doc.cols}">
                   <span class="lb" style="width:34px;text-align:right">ROWS</span><input class="n" data-k="rows" value="${doc.rows}"></div>
    <div class="r"><span class="lb">GAP</span><input class="n" data-k="gap" value="${doc.gap||0}"><span class="u">px</span>
                   <span class="lb" style="width:44px;text-align:right">MARGIN</span><input class="n" data-k="margin" value="${doc.margin||0}"></div>
    <div class="r"><span class="lb">SNAP</span><button class="n" style="width:auto;padding:3px 10px;cursor:pointer" id="snapT">${snap?'ON':'OFF'}</button>
                   <span class="lb" style="width:34px;text-align:right">SHOW</span><button class="n" style="width:auto;padding:3px 10px;cursor:pointer" id="gridT">${document.body.classList.contains('grid')?'ON':'OFF'}</button></div>
  </div>
  <div class="sec">
    ${secHead('Palette', 'rename in place · a swatch in use can’t be removed · the first swatch is the background',
      `<em>${doc.palette.length}</em><button id="addSw">+ ADD</button>`)}
    ${sw}
  </div>`;
}

function tabsHTML(o){
  const t = (id, label, badge='') =>
    `<button class="tab ${tab===id?'on':''}" data-tab="${id}">${label}${badge?` <em>${badge}</em>`:''}</button>`;
  return `<div class="tabs">
    ${o ? t('selection', o.type) : ''}
    ${t('artboard','Artboard')}
    ${t('layers','Layers', doc.objects.length)}
  </div>`;
}
function panel(){
  const o = cur();
  if(!o && tab === 'selection') tab = 'artboard';
  $('#panel').innerHTML = tabsHTML(o) + (tab === 'selection' && o ? objPanel(o) : docPanel());
  wire(); sync();
}

const CLAMP = { docw:[80,12000], doch:[80,12000], cols:[1,96], rows:[1,96], gap:[0,600], margin:[0,2000] };
/* Document fields route by key, never by "is anything selected" — the
   Artboard tab stays reachable while an object is selected, and the
   object has its own w/h. */
const DOCK = { docw:'w', doch:'h', cols:'cols', rows:'rows', gap:'gap', margin:'margin' };

/* ── numeric fields ──────────────────────────────────────────────────
   One delegated controller rather than listeners per input: the panel is
   rebuilt constantly, so per-input handlers die mid-gesture and leak.
   A press is a click until the pointer travels — below the threshold the
   field focuses and you type, above it we blur and scrub.               */
function fieldGet(k){
  if(DOCK[k]) return doc[DOCK[k]] ?? 0;
  const o = cur();
  if(!o) return 0;
  return Math.round((o[k] ?? 0) * 100) / 100;
}
function fieldSet(k, v){
  if(DOCK[k]){
    const [lo,hi] = CLAMP[k] || [0,9999];
    doc[DOCK[k]] = Math.max(lo, Math.min(hi, Math.round(v)));
    dirty = true; return;
  }
  const o = cur();
  if(!o) return;
  if(k === 'x' || k === 'y')      o[k] = Math.round(v*100)/100;
  else if(k === 'w' || k === 'h') o[k] = Math.max(1, Math.round(v));
  else if(k === 'size')           o.size = Math.max(1, Math.round(v));
  else if(k === 'lh')             o.lh   = Math.max(0, Math.round(v));   /* 0 = auto */
  else o[k] = Math.round(v);                                            /* rot, wt, tr */
  dirty = true;
}

let scrub = null;
document.addEventListener('pointerdown', e => {
  const inp = e.target.closest && e.target.closest('#panel .n[data-k]');
  if(!inp || e.button) return;
  scrub = { inp, k: inp.dataset.k, sx: e.clientX, sv: parseFloat(inp.value) || 0, live: false };
});
addEventListener('pointermove', e => {
  if(!scrub) return;
  const dx = e.clientX - scrub.sx;
  if(!scrub.live){
    if(Math.abs(dx) < 4) return;                 /* still a click */
    scrub.live = true; commit(); scrub.inp.blur();
  }
  e.preventDefault();
  fieldSet(scrub.k, scrub.sv + Math.round(dx/6));
  scrub.inp.value = fieldGet(scrub.k);
  renderSVG(); status();                         /* never panel() mid-scrub */
}, {passive:false});
addEventListener('pointerup', () => { if(scrub && scrub.live) panel(); scrub = null; });

function sync(){
  const o = cur();
  $('#msg').textContent = o
    ? `${o.type.toUpperCase()} · ${Math.round(o.x)} , ${Math.round(o.y)}${o.rot ? ' · ' + o.rot + '°' : ''}`
    : `${doc.cols}×${doc.rows} grid · ${doc.objects.length} object${doc.objects.length===1?'':'s'}`;
}

function wire(){
  const o = cur();

  $$('#panel .n[data-k]').forEach(inp => {
    const k = inp.dataset.k;
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('change', () => { commit(); fieldSet(k, parseFloat(inp.value) || 0); full(); });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ inp.blur(); return; }
      if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault(); commit();
      fieldSet(k, (parseFloat(inp.value)||0) + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1));
      inp.value = fieldGet(k);
      renderSVG(); status();          /* not panel() — that would kill focus */
    });
  });

  $$('#panel .sw[data-slot]').forEach(b => b.onclick = () => {
    commit(); const p = fillPct(o.fill);
    o.fill = b.dataset.slot + (p < 100 ? '@' + p : ''); touch();
  });
  $$('#panel .tint').forEach(b => b.onclick = () => {
    commit(); const t = +b.dataset.tint;
    o.fill = fillSlot(o.fill) + (t < 100 ? '@' + t : ''); touch();
  });
  $$('#panel .f[data-font]').forEach(b => b.onclick = () => { commit(); o.font = b.dataset.font; touch(); });
  $$('#panel .alb[data-al]').forEach(b => b.onclick = () => { commit(); o.al = b.dataset.al; touch(); });
  $$('#panel input[data-edit]').forEach(i => {
    i.addEventListener('focus', commit, {once:true});
    i.oninput = () => { doc.palette.find(p => p.id === i.dataset.edit).hex = i.value; dirty = true; renderSVG(); status(); };
  });
  $$('#panel .ly[data-pick]').forEach(b => b.onclick = () => { sel = +b.dataset.pick; tab = 'selection'; full(); });

  const ts = $('#tstr');
  if(ts){
    ts.addEventListener('focus', commit, {once:true});
    ts.oninput = () => { o.str = ts.value; dirty = true; renderSVG(); status(); };
  }
  const st = $('#snapT'); if(st) st.onclick = () => { snap = !snap; syncSnapUI(); panel(); };
  const gt = $('#gridT'); if(gt) gt.onclick = () => { document.body.classList.toggle('grid'); panel(); };

  $$('#panel .tab[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; panel(); });
  $$('#panel .swn[data-ren]').forEach(i => {
    i.onchange = () => renameSwatch(i.dataset.ren, i.value);
    i.onkeydown = e => { if(e.key === 'Enter') i.blur(); };
  });
  $$('#panel .swx[data-del]').forEach(b => b.onclick = () => delSwatch(b.dataset.del));

  const dn = $('#docname');
  if(dn) dn.onchange = () => { commit(); doc.name = dn.value.trim() || 'untitled'; touch(); };

  const gf = $('#gfont'), ga = $('#gadd');
  const submit = () => { if(!gf) return; const v = gf.value; gf.value = ''; addWebfont(v); };
  if(gf) gf.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
  if(ga) ga.onclick = submit;
  $$('#panel .fx[data-rm]').forEach(b => b.onclick = () => removeWebfont(b.dataset.rm));
  const as = $('#addSw'); if(as) as.onclick = addSwatch;
  const fk = $('#forkSw');
  if(fk) fk.onclick = () => {                       /* fork a private swatch for this object */
    commit();
    let n = 1; while(doc.palette.some(p => p.id === 'C' + n)) n++;
    doc.palette.push({ id: 'C' + n, hex: fillHex(o.fill) });
    o.fill = 'C' + n; touch();
  };
}
function syncSnapUI(){ $('#t-snap').querySelector('.k').textContent = snap ? 'ON' : 'OFF'; }

/* ════════════════════════════════════════════════════════════════════
   CANVAS — move, scale, rotate
   ═══════════════════════════════════════════════════════════════════ */
const toSvg = e => {
  const m = svgEl.getScreenCTM().inverse();
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
};
/* pointer into the object's own unrotated frame */
function unrot(p, o){
  if(!o.rot) return p;
  const c = pivot(o), a = -o.rot*Math.PI/180, dx = p.x-c.x, dy = p.y-c.y;
  return { x: c.x + dx*Math.cos(a) - dy*Math.sin(a), y: c.y + dx*Math.sin(a) + dy*Math.cos(a) };
}

function startGuide(axis, index){ drag = { mode:'guide', axis, index, moved:false }; }

['rulT','rulL'].forEach(id => document.getElementById(id).addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('edit')) return;
  e.preventDefault();
  const p = toSvg(e), g = guides();
  commit();
  if(id === 'rulT'){ g.h.push(Math.round(p.y)); startGuide('h', g.h.length-1); }
  else            { g.v.push(Math.round(p.x)); startGuide('v', g.v.length-1); }
  dirty = true; renderSVG();
}));

svgEl.addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('edit')) return;
  const p = toSvg(e);

  const gv = e.target.closest('[data-gv]'), gh = e.target.closest('[data-gh]');
  if(gv || gh){ commit(); startGuide(gv ? 'v' : 'h', +(gv || gh).dataset[gv ? 'gv' : 'gh']); return; }

  const h = e.target.closest('[data-h]');
  if(h && cur()){
    const o = cur(), c = pivot(o);
    commit();
    drag = h.dataset.h === 'rot'
      ? { mode:'rot', o, c, a0: Math.atan2(p.y-c.y, p.x-c.x)*180/Math.PI, r0: o.rot||0, moved:false }
      : { mode:'scale', o, k: h.dataset.h, b: localBox(o), moved:false };
    return;
  }

  const t = e.target.closest('[data-id],[data-hit]');
  if(!t){ sel = null; marks(); panel(); return; }
  sel = +(t.dataset.id ?? t.dataset.hit); tab = 'selection';
  const o = cur();
  commit();
  drag = { mode:'move', o, px0:p.x, py0:p.y, x0:o.x, y0:o.y, moved:false };
  marks(); panel();
});

addEventListener('pointermove', e => {
  if(!drag) return;
  e.preventDefault();
  const o = drag.o, free = !snap || e.altKey || e.ctrlKey;   /* ⌥ or ctrl */
  const p = toSvg(e);

  if(drag.mode === 'guide'){
    const g = guides();
    g[drag.axis][drag.index] = Math.round(drag.axis === 'v' ? p.x : p.y);
    drag.moved = true; dirty = true; renderSVG(); status();
    return;

  } else if(drag.mode === 'move'){
    let rx = drag.x0 + (p.x - drag.px0), ry = drag.y0 + (p.y - drag.py0);
    const b = localBox(o);
    if(free) snapG = { v:null, h:null };
    else [rx, ry] = snapToGuides(rx, ry, b.w, b.h);
    setPos(o, rx, ry);
    if(snapG.v !== null || snapG.h !== null){
      const gl = document.getElementById('guides');
      if(gl) gl.innerHTML = guidesSVG();
    }

  } else if(drag.mode === 'rot'){
    const a = Math.atan2(p.y - drag.c.y, p.x - drag.c.x)*180/Math.PI;
    let r = drag.r0 + (a - drag.a0);
    r = free ? Math.round(r) : Math.round(r/15)*15;
    o.rot = ((Math.round(r) % 360) + 360) % 360;

  } else {                                   /* scale */
    let q = unrot(p, o);
    /* snap the dragged corner to the grid/guides, but only for an upright
       box — a rotated corner has no meaning against document-space lines */
    if(!free && !o.rot){ q = { x: snapV(q.x), y: snapH(q.y) }; }
    const b = drag.b, k = drag.k;
    const ax = k.includes('w') ? b.x + b.w : b.x;      // anchor = opposite corner
    const ay = k.includes('n') ? b.y + b.h : b.y;
    if(o.type === 'text'){
      o.w = Math.round(Math.max(o.size * .6, Math.abs(q.x - ax)));
      if(k.includes('w')) setPos(o, ax - o.w, o.y);
    } else {
      o.w = Math.max(1, Math.round(Math.abs(q.x - ax)));
      o.h = Math.max(1, Math.round(Math.abs(q.y - ay)));
      setPos(o, k.includes('w') ? ax - o.w : ax, k.includes('n') ? ay - o.h : ay);
    }
    snapG = { v:null, h:null };
  }

  drag.moved = true; dirty = true;
  patch(o); marks(); live(o); status();
}, {passive:false});

const endDrag = () => {
  if(!drag) return;
  if(drag.mode === 'guide'){
    const g = guides(), v = g[drag.axis][drag.index];
    const limit = drag.axis === 'v' ? doc.w : doc.h;
    if(v < 0 || v > limit){ g[drag.axis].splice(drag.index, 1); flash('guide removed'); }
  }
  if(!drag.moved) undoS.pop();
  snapG = { v:null, h:null };
  drag = null; full();
};
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

/* keep panel numbers live without rebuilding it mid-drag */
function live(o){
  $$('#panel .n[data-k]').forEach(el => {
    if(document.activeElement === el) return;
    el.value = fieldGet(el.dataset.k);
  });
  sync();
}

/* ════════════════════════════════════════════════════════════════════
   OBJECTS
   ═══════════════════════════════════════════════════════════════════ */
function add(type){
  commit();
  /* land at the top-left margin, a third of the artboard across */
  const m = doc.margin||0, w = Math.round(doc.w/3), h = Math.round(doc.h/3);
  const base = { id: nextId(), x:m, y:m, w, h, rot:0, fill:defaultFill() };
  const fs = Math.round(doc.h/12);
  const o =
    type === 'text'    ? {...base, type:'text', y:m+fs, str:'TYPE HERE', font:'Poppins', size:fs,
                          tr:0, wt:500, lh:0, al:'l'}
  : type === 'half'    ? {...base, type:'half', h: Math.round(doc.h/6)}
  : type === 'ellipse' ? {...base, type:'ellipse'}
  : {...base, type:'rect'};
  doc.objects.push(o); sel = o.id; tab = 'selection'; touch();
}
function dup(){ const o = cur(); if(!o) return; commit();
  const off = Math.round(Math.max(doc.w,doc.h)/40);
  const c = {...o, id:nextId(), x:o.x+off, y:o.y+off}; doc.objects.push(c); sel = c.id; touch(); }
function del(){ if(sel === null) return; commit();
  doc.objects = doc.objects.filter(o => o.id !== sel); sel = null; touch(); }
function order(d){
  const i = doc.objects.findIndex(o => o.id === sel); if(i < 0) return;
  const j = i + d; if(j < 0 || j >= doc.objects.length) return;
  commit(); [doc.objects[i], doc.objects[j]] = [doc.objects[j], doc.objects[i]]; touch();
}
function centre(axis){
  const o = cur(); if(!o) return; commit();
  const b = localBox(o);                             /* text box left edge == o.x */
  if(axis === 'x') setPos(o, o.x + ((doc.w - b.w)/2 - b.x), o.y);
  else             setPos(o, o.x, o.y + ((doc.h - b.h)/2 - b.y));
  touch();
}
function guidesFromSel(){
  const o = cur(); if(!o) return flash('select something first');
  commit();
  const b = localBox(o), g = guides();
  [b.x, b.x + b.w].forEach(x => { if(!g.v.includes(Math.round(x))) g.v.push(Math.round(x)); });
  [b.y, b.y + b.h].forEach(y => { if(!g.h.includes(Math.round(y))) g.h.push(Math.round(y)); });
  touch(); flash('guides added on all four edges');
}
function snapSel(){ const o = cur(); if(!o) return; commit();
  const b = localBox(o), nx = nearest(snapLinesV(), b.x), ny = nearest(snapLinesH(), b.y);
  setPos(o, o.x + (nx - b.x), o.y + (ny - b.y)); touch(); }
function rot90(){ const o = cur(); if(!o) return; commit(); o.rot = ((o.rot||0) + 90) % 360; touch(); }
function resetRot(){ const o = cur(); if(!o) return; commit(); o.rot = 0; touch(); }
function fitWidth(){
  const o = cur(); if(!o || o.type === 'text') return;
  const m = doc.margin||0;
  commit(); o.x = m; o.w = doc.w - 2*m; touch();
}
function addSwatch(){
  commit();
  let n = 1; while(doc.palette.some(p => p.id === 'C' + n)) n++;
  doc.palette.push({ id: 'C' + n, hex: '#888888' });
  tab = 'artboard'; touch();
}
function renameSwatch(oldId, raw){
  const id = raw.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(!id || id === oldId) return full();
  if(doc.palette.some(p => p.id === id)) return flash('a swatch named ' + id + ' already exists'), full();
  commit();
  doc.palette.find(p => p.id === oldId).id = id;
  doc.objects.forEach(o => {                       // keep every reference pointing home
    if(fillSlot(o.fill) === oldId){
      const p = fillPct(o.fill);
      o.fill = id + (p < 100 ? '@' + p : '');
    }
  });
  touch();
}
function delSwatch(id){
  if(doc.palette[0] && doc.palette[0].id === id) return flash('the first swatch is the background — it can’t be removed');
  if(doc.palette.length <= 2) return flash('keep at least two swatches');
  if(doc.objects.some(o => fillSlot(o.fill) === id)) return flash(id + ' is in use — recolour those objects first');
  commit();
  doc.palette = doc.palette.filter(p => p.id !== id);
  touch();
}

/* ════════════════════════════════════════════════════════════════════
   SAVE — the DOM is the file
   ═══════════════════════════════════════════════════════════════════ */
function serialize(){
  $('#doc-data').textContent = '\n' + JSON.stringify(doc, null, 1) + '\n';
  renderSVG();
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#handles').innerHTML = '';
  c.querySelector('body').className = document.body.classList.contains('grid') ? 'grid' : '';
  c.querySelector('#panel').innerHTML = '';
  c.querySelector('#cmdlist').innerHTML = '';
  c.querySelector('#cmdk').classList.remove('open');
  c.querySelector('#cmdin').setAttribute('value','');
  c.querySelector('title').textContent = doc.name;
  return '<!DOCTYPE html>\n' + c.outerHTML + '\n';
}
const slug = () => doc.name.replace(/[^\w-]+/g,'-').toLowerCase();

async function save(){
  const html = serialize();
  if(CAN_WRITE){
    try{
      if(!handle) handle = await showSaveFilePicker({
        suggestedName: slug() + '.html',
        types:[{description:'Plakt', accept:{'text/html':['.html']}}]
      });
      const w = await handle.createWritable();
      await w.write(html); await w.close();
      doc.name = handle.name.replace(/\.html$/,'');
      dirty = false; status(); flash('written back into ' + handle.name);
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
      flash('could not write back — downloading instead');
    }
  }
  download(html, slug() + '.html', 'text/html');
  dirty = false; status();
}
function download(data, name, type){
  saveURL(URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type})), name);
}
/* the anchor must be in the document — Firefox drops synthetic clicks on
   detached elements, which is why exporting silently did nothing */
function saveURL(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}
function standaloneSVG(){
  const c = svgEl.cloneNode(true);
  const g = c.querySelector('#gridlines'); if(g) g.remove();
  const gu = c.querySelector('#guides');    if(gu) gu.remove();
  const hd = c.querySelector('#handles');  if(hd) hd.remove();
  c.setAttribute('width', doc.w); c.setAttribute('height', doc.h);
  c.setAttribute('xmlns', NS);
  /* an SVG rasterised through an <img> is its own document — it cannot
     see the page's @font-face rules, so carry them inside */
  const src = document.getElementById('fonts');
  if(src){
    const st = document.createElementNS(NS, 'style');
    st.textContent = src.textContent;
    c.insertBefore(st, c.firstChild);
  }
  return new XMLSerializer().serializeToString(c);
}
function exportSVG(){ download(standaloneSVG(), slug()+'.svg', 'image/svg+xml'); flash('exported svg'); }
async function exportPNG(scale){
  flash(`rendering @${scale}x…`);
  try{
    if(document.fonts) await document.fonts.ready;
    /* data: rather than blob: — under an opaque origin a blob-backed image
       taints the canvas and toBlob/toDataURL then throw SecurityError */
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(standaloneSVG());
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('the browser refused to rasterise the svg'));
      img.src = src;
    });
    const cv = document.createElement('canvas');
    cv.width = Math.round(doc.w*scale); cv.height = Math.round(doc.h*scale);
    const g = cv.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, cv.width, cv.height);

    let url = null;
    try{
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      if(blob) url = URL.createObjectURL(blob);
    }catch(e){ /* fall through to the data-url path */ }
    if(!url) url = cv.toDataURL('image/png');

    saveURL(url, `${slug()}@${scale}x.png`);
    flash(`exported ${cv.width}×${cv.height} png`);
  }catch(err){
    const m = (err && err.name === 'SecurityError')
      ? 'blocked by the sandbox — open the saved file directly and retry'
      : (err && err.message) || 'could not rasterise';
    flash('png export failed — ' + m);
  }
}

/* ── command palette ─────────────────────────────────────────────── */
let ci = 0, hits = CMDS;
function cmdOpen(){ $('#cmdk').classList.add('open'); $('#cmdin').value=''; ci=0; cmdFilter(''); $('#cmdin').focus(); }
function cmdClose(){ $('#cmdk').classList.remove('open'); }
function cmdFilter(q){
  q = q.toLowerCase();
  hits = CMDS.filter(c => c.n.toLowerCase().includes(q));
  ci = Math.min(ci, Math.max(0, hits.length-1));
  $('#cmdlist').innerHTML = hits.length
    ? hits.map((c,i) => `<button class="c ${i===ci?'on':''}" data-i="${i}">${c.n}<span class="k">${c.k}</span></button>`).join('')
    : '<div class="ce">No command matches. Try “export”.</div>';
  $$('#cmdlist .c').forEach(b => b.onclick = () => { cmdClose(); hits[+b.dataset.i].f(); });
}
$('#cmdin').addEventListener('input', e => cmdFilter(e.target.value));
$('#cmdk').addEventListener('pointerdown', e => { if(e.target.id === 'cmdk') cmdClose(); });

/* ── keys ────────────────────────────────────────────────────────── */
addEventListener('keydown', e => {
  const open = $('#cmdk').classList.contains('open');
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();

  if(mod && k === 'k'){ e.preventDefault(); open ? cmdClose() : cmdOpen(); return; }
  if(mod && k === 's'){ e.preventDefault(); save(); return; }
  if(mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && k === 'd'){ e.preventDefault(); dup(); return; }

  if(open){
    if(e.key === 'Escape') cmdClose();
    if(e.key === 'ArrowDown'){ e.preventDefault(); ci = Math.min(ci+1, hits.length-1); cmdFilter($('#cmdin').value); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); ci = Math.max(ci-1, 0); cmdFilter($('#cmdin').value); }
    if(e.key === 'Enter' && hits[ci]){ cmdClose(); hits[ci].f(); }
    return;
  }
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;

  const edit = document.body.classList.contains('edit');
  if(k === 'e' && !edit){ mode(true); return; }
  if(e.key === 'Escape'){ if(sel !== null){ sel = null; marks(); panel(); } else mode(false); return; }
  if(!edit) return;

  if(e.shiftKey && k === 'r'){ rot90(); return; }
  const keys = {r:'rect', c:'ellipse', h:'half', t:'text'};
  if(keys[k]){ add(keys[k]); return; }
  if(k === 'g'){ document.body.classList.toggle('grid'); return; }
  if(e.key === ']'){ order(1); return; }
  if(e.key === '['){ order(-1); return; }
  if(e.key === 'Backspace' || e.key === 'Delete'){ e.preventDefault(); del(); return; }

  if(e.key.startsWith('Arrow') && sel !== null){
    e.preventDefault();
    const o = cur(), step = e.shiftKey ? 10 : 1;   /* ⇧ nudges by 10px */
    const d = e.key === 'ArrowLeft' ? [-1,0] : e.key === 'ArrowRight' ? [1,0]
            : e.key === 'ArrowUp' ? [0,-1] : [0,1];
    commit();
    o.x += d[0]*step; o.y += d[1]*step;
    touch();
  }
});

/* ── wiring ──────────────────────────────────────────────────────── */
$$('.tl[data-add]').forEach(b => b.onclick = () => add(b.dataset.add));
$('#t-view').onclick = () => mode(false);
$('#t-undo').onclick = undo;
$('#t-snap').onclick = () => { snap = !snap; syncSnapUI(); panel(); };
$('#stage').addEventListener('dblclick', () => { if(!document.body.classList.contains('edit')) mode(true); });
/* click the stage margin — anywhere off the artboard — to clear the selection */
$('#stage').addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('edit') || e.target.closest('#board')) return;
  if(sel !== null){ sel = null; marks(); panel(); }
});
$('#ver').textContent = VERSION;
addEventListener('resize', marks);
if(document.fonts) document.fonts.ready.then(renderSVG);

ensureWebfonts();

/* boot in view mode — you received a plakt, not an application */
full();
</script>
</body>
