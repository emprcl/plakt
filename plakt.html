<style>
/* CLASS LEGEND — the chrome uses short names; here's what they are:
   layout   .cr common chrome (fades in edit mode) · #rail tools · #panel
            inspector · #status footer
   panel    .sec section · .sh section heading · .r field row · .lb label ·
            .n numeric field (drag to scrub) · .tip helper text · .u unit
   swatches .sw palette row · .swn name field · .swx delete · .ch colour chip
   fill     .tint tint button · .fw/.f/.fx font row/button/remove · .alb
            small toggle button (align, add)
   layers   .ly layer row · .tab/.tabs inspector tabs
   canvas   .o an object node · .hd resize/rotate handle · .sel-o/.sel-i
            selection outline · .gd/.gh guide line/hit-target · .rul ruler
   palette (command bar): .c command row · .k keyboard hint            */
:root{
  --ink:#e9e9e7; --dim:#8d8d8a; --faint:#575755;
  --chrome:#111110; --chrome2:#1c1c1a; --field:#b3b3b0;
  --hair:rgba(233,233,231,.14);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --t:170ms cubic-bezier(.4,0,.2,1);
  --rail:112px; --pan:272px; --stat:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--field);font:11px/1.4 var(--mono);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;border-radius:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:1px}

#stage{position:fixed;inset:0;display:grid;place-items:center;padding:0;transition:padding var(--t)}
body.edit #stage{padding:0 var(--pan) var(--stat) var(--rail)}
#board{position:relative;height:min(90vh,900px);aspect-ratio:var(--ar,3/4);
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 18px 52px rgba(0,0,0,.3);transition:height var(--t);
  transform:translate(var(--panx,0px),var(--pany,0px)) scale(var(--zoom,1))}
body.edit #board{height:min(78vh,820px)}
/* an SVG root clips to its viewBox by default, which would cut the
   selection outline and handles off at the artboard edge — the art is
   clipped explicitly instead (see #artboard-clip in renderSVG) so the
   editor overlay can hang over the sides */
#board svg{display:block;width:100%;height:100%;user-select:none;touch-action:none;overflow:visible}
#guides{opacity:0;pointer-events:none;transition:opacity var(--t)}
body.edit.grid #guides{opacity:1;pointer-events:auto}
/* Editor chrome drawn over the artboard — guides, selection, handles,
   marquee — is measured in screen pixels, not document units: at 4× a
   3px selection border would paint as 12px and bury the artwork it's
   meant to frame. vector-effect:non-scaling-stroke alone only undoes the
   viewBox scale, not #board's CSS scale(--zoom), so every such width is
   also divided by --zoom to come out the same size on screen at any
   zoom. Handle geometry (which is real SVG geometry, not stroke) gets
   the same treatment in JS — see hUnit(). */
.gd{stroke:#12b8d8;stroke-width:calc(1px/var(--zoom,1));vector-effect:non-scaling-stroke;pointer-events:none}
.gd.hot{stroke:#fff;stroke-width:calc(2px/var(--zoom,1))}
.gh{stroke:#000;stroke-opacity:0;stroke-width:calc(11px/var(--zoom,1));vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:grab}
.rul{position:absolute;background:var(--chrome);opacity:0;transition:opacity var(--t)}
body.edit.grid .rul{opacity:1}
.rul:hover{background:#2a2a28}
#rulT{left:0;right:0;top:-13px;height:12px;cursor:row-resize}
#rulL{top:0;bottom:0;left:-13px;width:12px;cursor:col-resize}
#gridlines{opacity:0;transition:opacity var(--t);pointer-events:none}
body.edit.grid #gridlines{opacity:1}
.sel-o{fill:none;stroke:#fff;stroke-width:calc(3px/var(--zoom,1));vector-effect:non-scaling-stroke;opacity:.45;pointer-events:none}
.sel-i{fill:none;stroke:#000;stroke-width:calc(1px/var(--zoom,1));vector-effect:non-scaling-stroke;pointer-events:none}
.hd{fill:#fff;stroke:#000;stroke-width:calc(1px/var(--zoom,1));vector-effect:non-scaling-stroke}
.hd:hover{fill:#000;stroke:#fff}
.hd-l{stroke:#000;stroke-width:calc(1px/var(--zoom,1));vector-effect:non-scaling-stroke;pointer-events:none}
#marquee rect{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:calc(1px/var(--zoom,1));vector-effect:non-scaling-stroke;pointer-events:none}
/* the outline standing in for a mask shape while you're inside its group
   — a dashed hairline you can still click, and nothing at all outside
   edit mode (a saved plakt is a poster, not an editor) */
.mg{display:none}
body.edit .mg{display:block;fill:none;stroke:#12b8d8;stroke-width:calc(1px/var(--zoom,1));
  stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:all;cursor:move}
body.edit .o{cursor:move}
body.space #stage{cursor:grab}
body.space .o{cursor:grab}
body.panning #stage{cursor:grabbing}
body.panning .o{cursor:grabbing}



.cr{transition:opacity var(--t),transform var(--t)}
body:not(.edit) .cr{opacity:0;pointer-events:none}
#editBtn{position:fixed;top:14px;right:14px;background:var(--chrome);color:var(--ink);
  border:1px solid var(--hair);padding:8px 16px;letter-spacing:.14em;font-size:11px;
  transition:opacity var(--t),background 90ms}
#editBtn:hover{background:var(--chrome2)}
body.edit #editBtn{opacity:0;pointer-events:none}
#rail{position:fixed;left:0;top:0;bottom:var(--stat);width:var(--rail);background:var(--chrome);
  border-right:1px solid var(--hair);padding:13px 0;display:flex;flex-direction:column;transform:translateX(-12px)}
body.edit #rail{transform:none}
.rh{padding:0 14px 9px;color:var(--faint);letter-spacing:.18em;font-size:9px;text-transform:uppercase}
.tl{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;
  letter-spacing:.14em;color:var(--dim);width:100%;transition:color 90ms,background 90ms}
.tl:hover{color:var(--ink);background:var(--chrome2)}
.tl .k{color:var(--faint);font-size:10px}
.rf{margin-top:auto;padding:0 14px;color:var(--faint);line-height:1.85;font-size:10px}
.touch{display:none}

#panel{position:fixed;right:0;top:0;bottom:var(--stat);width:var(--pan);background:var(--chrome);
  border-left:1px solid var(--hair);overflow-y:auto;transform:translateX(12px)}
body.edit #panel{transform:none}
.sec{border-bottom:1px solid var(--hair);padding:12px 15px}
.tabs{display:flex;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--chrome);z-index:2}
.tab{flex:1;min-width:0;padding:11px 6px;color:var(--faint);letter-spacing:.08em;font-size:9px;
  text-transform:uppercase;border-bottom:1px solid transparent;transition:color 90ms;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab em{font-style:normal;color:var(--faint)}
.swn{background:none;border:1px solid transparent;color:var(--dim);padding:2px 4px;width:74px;
  letter-spacing:.12em;text-transform:uppercase}
.swn:hover{border-color:var(--hair)}
.swn:focus{outline:none;border-color:var(--dim);color:var(--ink)}
.swx{color:var(--faint);padding:0 4px;font-size:13px;line-height:1;opacity:0}
.sw:hover .swx{opacity:1}
.swx:hover{color:#fff}
#gfont{font-size:11px}
.sh{color:var(--faint);letter-spacing:.18em;font-size:9px;text-transform:uppercase;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;position:relative}
.shl{margin-right:auto;display:inline-flex;align-items:center;gap:7px;min-width:0}
.sh em{font-style:normal;color:var(--dim)}
.sh button{color:var(--faint);letter-spacing:.1em}
.sh button:hover{color:var(--ink)}
/* per-section help: a "?" that reveals a bubble, replacing inline tips */
.help{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;
  flex:none;border:1px solid var(--hair);border-radius:50%;color:var(--faint);font-size:9px;
  letter-spacing:0;cursor:help}
.help:hover,.help:focus{color:var(--ink);border-color:var(--dim);outline:none}
.ht{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;
  background:var(--chrome2);border:1px solid var(--hair);box-shadow:0 8px 24px rgba(0,0,0,.5);
  padding:8px 10px;color:var(--dim);letter-spacing:.02em;text-transform:none;font-size:10px;
  line-height:1.65;opacity:0;visibility:hidden;transition:opacity var(--t);pointer-events:none}
.help:hover .ht,.help:focus .ht{opacity:1;visibility:visible}
.ht b{font-weight:400;color:var(--ink)}
.r{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.r:last-child{margin-bottom:0}
.lb{color:var(--faint);width:34px;flex:none;letter-spacing:.1em;font-size:10px}
.n{background:var(--chrome2);border:1px solid transparent;color:var(--ink);padding:3px 6px;
  width:48px;text-align:right;cursor:ew-resize}
.n:hover{border-color:var(--hair)}
.n:focus{outline:none;border-color:var(--dim);cursor:text}
.n.d{color:#fff}
.plus{color:var(--faint)}
.alb{background:var(--chrome2);color:var(--dim);padding:3px 0;width:30px;text-align:center;
  border:1px solid transparent;letter-spacing:.1em}
.alb:hover{border-color:var(--hair);color:var(--ink)}
.alb.on{background:var(--ink);color:var(--chrome)}
/* a reference the current selection can't actually use (SELECTION with one
   object, ARTBOARD from inside a group) — still shown, so the choice reads
   as a pair, but visibly out of reach and carrying a title saying why */
.alb[disabled]{color:var(--faint);cursor:default}
.alb[disabled]:hover{border-color:transparent;color:var(--faint)}
.fw{display:flex;align-items:center;margin:0 -6px;width:calc(100% + 12px)}
.fw:hover{background:var(--chrome2)}
.fw .f{flex:1;margin:0;width:auto;background:none}
.fx{color:var(--faint);padding:0 8px;font-size:13px;line-height:1;opacity:0}
.fw:hover .fx{opacity:1}
.fx:hover{color:#fff}
.u{color:var(--faint);font-size:9px;letter-spacing:.1em}
.n{width:56px}
.sel{background:var(--chrome2);border:1px solid transparent;color:var(--ink);padding:3px 6px;
  width:100%;letter-spacing:.06em;cursor:pointer}
.sel:hover{border-color:var(--hair)}
.sel:focus{outline:none;border-color:var(--dim)}
.tx{background:var(--chrome2);border:1px solid transparent;color:var(--ink);padding:5px 7px;
  width:100%;resize:none;line-height:1.5}
.tx:focus{outline:none;border-color:var(--dim)}
.tip{color:var(--faint);line-height:1.7;font-size:10px;margin-top:8px}

     Plain JSON, greppable without executing anything. The inline <svg>
     below is generated from it and renders on its own with JS disabled.

     Artboard: w/h in document units (= the @1x PNG size). cols/rows/gap/
     margin describe the module grid, which is a *snapping guide only* —
     nothing in an object references it, so editing the grid never moves
     anything.

     Object geometry is absolute, in document units:
       x, y  top-left corner   (text: x = left edge of the wrap frame,
                                       y = the first baseline)

         slot ids are otherwise just labels — safe to rename.

<script id="app">
"use strict";
/* ════════════════════════════════════════════════════════════════════
   PLAKT — a graphic design tool that is also its own document.

   VOCABULARY (the names are terse; here's the map):
     doc            the document object — the single source of truth
     cur()          the currently selected object, or null
     box(o)         an object's absolute {x,y,w,h}; localBox() is the same
                    but returns the visual ink box for text
     full()         re-render everything (svg + panel + status)
     touch()        mark the doc dirty, then full()
     renderSVG()    rebuild the artboard <svg> from doc
     patch(o)       update one object's svg node in place (no rebuild)
     marks()        draw the selection outline + resize/rotate handles
     panel()        rebuild the right-hand inspector
     wire()         attach listeners to the freshly-rebuilt panel
     sync()/live()  refresh the status line / panel numbers without a rebuild
     commit()       push an undo snapshot before a mutation
     G()            current grid metrics {m,g,cw,rh}
     snapLinesV/H() the lines an object can snap to (margins+grid+guides)
   ═══════════════════════════════════════════════════════════════════ */

const VERSION = '0.1.0';                            /* shown bottom-right */
const EMBEDDED = ['Poppins','Lora','Caladea','Liberation Sans','DejaVu Sans Mono'];
/* Embedded faces travel with the file. Google faces are a deliberate
   exception: they need the network, so they're marked in the picker and
   they will not rasterise into a PNG export offline. */
const fontList = () => EMBEDDED.concat(doc.webfonts || []);
const isWeb = f => (doc.webfonts || []).includes(f);

function linkFont(family){
  const id = 'gf-' + family.replace(/\W+/g,'-').toLowerCase();
  if(document.getElementById(id)) return;
  const l = document.createElement('link');
  l.id = id; l.rel = 'stylesheet'; l.dataset.webfont = family;
  l.href = 'https://fonts.googleapis.com/css2?family=' +
           family.replace(/ /g,'+') + '&display=swap';
  document.head.appendChild(l);
}
function ensureWebfonts(){ (doc.webfonts || []).forEach(linkFont); }

function removeWebfont(family){
  commit();
  doc.webfonts = (doc.webfonts || []).filter(f => f !== family);
  const el = document.getElementById('gf-' + family.replace(/\W+/g,'-').toLowerCase());
  if(el) el.remove();
  allObjects().forEach(o => { if(o.font === family) o.font = EMBEDDED[0]; });
  touch(); flash(family + ' removed');
}

async function addWebfont(raw){
  const family = String(raw).trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  if(!family) return;
  if(fontList().includes(family)) return flash(family + ' is already listed');
  linkFont(family);

}

function guidesSVG(){

    `<line class="gd${snapG.v===x?' hot':''}" x1="${x}" y1="0" x2="${x}" y2="${doc.h}"/>`,

  g.h.forEach((y,i) => s.push(
    `<line class="gd${snapG.h===y?' hot':''}" x1="0" y1="${y}" x2="${doc.w}" y2="${y}"/>`,

function gridSVG(){
  const {m,g,cw,rh} = G();

/* Text metrics without waiting on the DOM. getBBox is only valid once the

const MC = document.createElement('canvas').getContext('2d');

/* leading in pixels; 0 (or unset) means auto — track 1.2× the size */
const LH = o => o.lh > 0 ? o.lh : Math.round(1.2 * o.size);

/* The frame constrains the copy: text wraps to the box width, so widening
   the box re-flows the lines instead of rescaling the type. */
function wrapLines(o){
  const max = o.w;
  MC.font = `${o.wt||400} ${o.size}px ${cssFont(o.font)}`;
  const tw = s => MC.measureText(s).width + (o.tr||0) * Math.max(0, s.length - 1);
  const out = [];
  String(o.str).split('\n').forEach(para => {
    if(!para.trim()){ out.push(''); return; }
    let line = '';
    para.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if(line && tw(t) > max){ out.push(line); line = word; } else line = t;
    });
    out.push(line);
  });
  return out.length ? out : [''];
}
function textAnchor(o){

/* The box the glyphs actually paint into — measured off the laid-out
   lines, so it tracks the alignment: a centred or right-aligned line
   sits nowhere near o.x, and a short line in a wide frame stops well
   short of o.x + o.w. This is what you see on the artboard, so it's what
   snapping lines up (see snapOffsets); the frame is a separate thing. */
function textInk(o){
  const lines = wrapLines(o), lh = LH(o), asc = o.size * .78;
  const {anchor, x: ax} = textAnchor(o);
  MC.font = `${o.wt||400} ${o.size}px ${cssFont(o.font)}`;
  const lineW = s => MC.measureText(s).width + (o.tr||0) * Math.max(0, s.length - 1);
  const spans = lines.map(l => {
    const w = lineW(l);
    const start = anchor === 'start' ? ax : anchor === 'end' ? ax - w : ax - w/2;
    return [start, start + w];
  });
  const x0 = Math.min(...spans.map(s => s[0])), x1 = Math.max(...spans.map(s => s[1]));
  return {
    x: x0,
    y: o.y - asc,
    w: x1 - x0,
    h: asc + lh * (lines.length - 1) + o.size * .26

}
/* What you grab: the ink and the frame together. wrapLines() only ever
   breaks between words — a single word wider than o.w has nowhere to
   break, so it renders past the frame edge; the selection outline,
   resize handles and click hit-area all have to enclose that overflow
   rather than stay clamped to the nominal o.w. Equally the frame itself
   stays inside the box even when the copy is far narrower, because the
   frame is what a resize drag is actually resizing. */
function textBox(o){
  const ink = textInk(o);
  const x0 = Math.min(o.x, ink.x), x1 = Math.max(o.x + o.w, ink.x + ink.w);
  return { x: x0, y: ink.y, w: x1 - x0, h: ink.h };
}

const NS = 'http://www.w3.org/2000/svg';

/* <text> only hit-tests on painted glyphs, so a click between letters falls
   through. Lay a transparent rect over each text block's real ink box. */
function textHits(){
  allObjects().forEach(o => {
    if(o.type !== 'text') return;
    /* skip the copy living inside a <clipPath> — inserting a hit rect in
       there would silently become part of the clip */
    const el = [...svgEl.querySelectorAll(`[data-id="${o.id}"]`)].find(n => !n.closest('clipPath'));
    if(!el) return;
    const b = textBox(o), p = unit()*0.3, r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', b.x - p);     r.setAttribute('y', b.y - p);
    r.setAttribute('width',  b.w + p*2);
    r.setAttribute('height', b.h + p*2);
    r.setAttribute('fill', '#000');   r.setAttribute('fill-opacity', '0');
    r.setAttribute('pointer-events', 'all');
    r.setAttribute('class', 'o');     r.setAttribute('data-hit', o.id);
    const t = el.getAttribute('transform'); if(t) r.setAttribute('transform', t);

function renderSVG(){
  svgEl.setAttribute('viewBox', `0 0 ${doc.w} ${doc.h}`);

     there, in the editor exactly as in the export. The editor's own
     overlay — guides, selection, handles, marquee — is not artwork and
     must not be cropped with it, or a shape dragged half off the board
     loses the very handles you need to drag it back. So the art rides
     inside an explicit clip to the artboard rect, and the SVG itself is
     allowed to overflow (see #doc-svg in the stylesheet) so the overlay,
     which sits outside that clip, stays whole. */
  svgEl.innerHTML =
    `<defs>${gradDefsSVG()}${imgFxDefs()}<clipPath id="artboard-clip"><rect width="${doc.w}" height="${doc.h}"/></clipPath></defs>` +
    `<g id="art" clip-path="url(#artboard-clip)">` +
      `<rect id="bg" width="${doc.w}" height="${doc.h}" fill="${bg().hex}"/>` +
      doc.objects.map(shapeSVG).join('') +

         image or a rect covering the artboard would otherwise hide the
         very lines you are lining it up against. It stays inside the
         clip (it belongs to the artboard) and stays out of hit-testing

      `<g id="gridlines" fill="#ff2e88" fill-opacity=".16">${gridSVG()}</g>` +

    `<g id="guides">${guidesSVG()}</g>` +
    `<g id="handles"></g>` +

}

/* patch one object in place — never rebuild the DOM mid-interaction.
   Every element carrying the id, not just the first: a mask shape is in
   the DOM twice, once as the clip's geometry and once as the ghost

   the revealed area lags behind the outline you're dragging. */
function patch(o){

function patchEl(o, el){

  const b = box(o), t = rotAttr(o).replace(/^ transform="|"$/g,'');
  t ? el.setAttribute('transform', t) : el.removeAttribute('transform');
  if(o.type === 'ellipse'){
    el.setAttribute('cx', b.x+b.w/2); el.setAttribute('cy', b.y+b.h/2);
    el.setAttribute('rx', b.w/2);     el.setAttribute('ry', b.h/2);
  } else if(o.type === 'half'){
    el.setAttribute('d', `M ${b.x} ${b.y+b.h} A ${b.w/2} ${b.h} 0 0 1 ${b.x+b.w} ${b.y+b.h} Z`);
  } else if(o.type === 'triangle'){
    el.setAttribute('d', `M ${b.x} ${b.y+b.h} L ${b.x+b.w} ${b.y+b.h} L ${b.x+b.w/2} ${b.y} Z`);
  } else if(o.type === 'line'){
    el.setAttribute('x1', b.x); el.setAttribute('y1', b.y);
    el.setAttribute('x2', b.x+b.w); el.setAttribute('y2', b.y+b.h);
  } else if(o.type === 'text'){
    const {anchor, x} = textAnchor(o), lh = LH(o);
    el.setAttribute('x', x); el.setAttribute('y', o.y);
    el.setAttribute('text-anchor', anchor); el.setAttribute('font-size', o.size);
    el.innerHTML = wrapLines(o).map((l,i) =>
      `<tspan x="${x}" dy="${i ? lh : 0}">${esc(l) || '&#160;'}</tspan>`).join('');
  } else {
    el.setAttribute('x', b.x); el.setAttribute('y', b.y);
    el.setAttribute('width', b.w); el.setAttribute('height', b.h);
  }
}

/* ── selection + transform handles ───────────────────────────────── */
/* a line's endpoints can be dragged past each other, giving it a negative
   w and/or h (box(o) — and the line's own rendering — keep those signed
   values as-is, since x1/y1→x2/y2 needs the real direction) — but every
   bbox/snap/align consumer here wants a normal positive-area rectangle,
   so localBox() is the one place that normalises it for them. */
function localBox(o){
  if(o.type === 'text') return textBox(o);
  if(o.type === 'line') return { x: Math.min(o.x, o.x+o.w), y: Math.min(o.y, o.y+o.h), w: Math.abs(o.w), h: Math.abs(o.h) };
  return box(o);

/* every object that exists, a group's children flattened in alongside it —
   groups nest one level deep, so this is the whole story */
const allObjects = () => doc.objects.flatMap(o => o.type === 'group' ? [o, ...o.children] : [o]);
/* the list new objects join and existing ones are found in right now: the
   whole document normally, or one group's children while drilled into it */
const activeList = () => {
  if(!entered) return doc.objects;
  const g = doc.objects.find(o => o.id === entered && o.type === 'group');
  return g ? g.children : doc.objects;
};
/* the group (if any) that owns this id as a direct child */
const parentGroupOf = id => (doc.objects.find(o => o.type === 'group' && o.children.some(c => c.id === id)) || {}).id ?? null;

/* the objects `sel` (an array of ids) currently points to, in stack order */
const selectedObjs = () => sel.map(id => allObjects().find(o => o.id === id)).filter(Boolean);
/* the axis-aligned box enclosing a set of resolved objects' own boxes —

function bboxOf(objs){

     drop truly degenerate (both zero) boxes, e.g. a font metric that
     hasn't resolved yet */
  const bs = objs.map(localBox).filter(b => b.w > 0 || b.h > 0);
  if(!bs.length) return {x:0,y:0,w:0,h:0};
  const x0 = Math.min(...bs.map(b=>b.x)), y0 = Math.min(...bs.map(b=>b.y));
  const x1 = Math.max(...bs.map(b=>b.x+b.w)), y1 = Math.max(...bs.map(b=>b.y+b.h));

/* a single selected object gets full resize/rotate handles; a multi-

/* a child's stored x/y/w/h/rot are relative to its parent group's own

   same math ungroupSel() uses to flatten a child back to a real leaf) —

function marks(){

    h.innerHTML = `<g${t}>
      <line class="sel-o" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
      <line class="sel-i" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
      <circle class="hd" data-h="p1" cx="${x1}" cy="${y1}" r="${s}" style="cursor:move"/>

    <rect class="sel-o" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
    <rect class="sel-i" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
    <line class="hd-l" x1="${rx}" y1="${b.y}" x2="${rx}" y2="${ry}"/>
    ${cs.map(([k,x,y]) => `<rect class="hd" data-h="${k}" x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}"
        style="cursor:${k==='nw'||k==='se'?'nwse':'nesw'}-resize"/>`).join('')}
    <circle class="hd" data-h="rot" cx="${rx}" cy="${ry}" r="${s*1.1}" style="cursor:grab"/>
  </g>`;
}

/* cur() is the single object being edited in detail — it's null while
   nothing or more than one thing is selected; multi-select drives group
   move/delete/duplicate instead (see selectedObjs()) */
const cur  = () => sel.length === 1 ? allObjects().find(o => o.id === sel[0]) || null : null;
const full = () => { renderSVG(); panel(); status(); };
/* auto-capture a version on every modification, debounced: each call

   and swatch <input>s (all via liveEdit() where they share a shape). A
   drag mutates o.x/o.y directly frame-by-frame for performance (see the
   pointermove handler) and only calls full() at the end, never touch();

/* ════════════════════════════════════════════════════════════════════
   PANEL
   ═══════════════════════════════════════════════════════════════════ */
function num(lb, k, v, w, u=''){
  /* .lb defaults to a fixed 34px — plenty for ROT/RADIUS/etc, but a longer
     label like OPACITY needs to ask for more or it visually crowds the
     input next to it */
  const style = w ? ` style="width:${w}px"` : '';
  return `<div class="r"><span class="lb"${style}>${lb}</span><input class="n" data-k="${k}" value="${v}">${u?`<span class="u">${u}</span>`:''}</div>`;
}
/* The nine weights CSS actually defines. Type has no use for the values
   in between — 437 is not a weight any face ships, it just renders as
   whichever real one the browser rounds to — so this is a list to pick
   from, not a number to scrub. */
const WEIGHTS = [[100,'THIN'],[200,'EXTRA LIGHT'],[300,'LIGHT'],[400,'REGULAR'],
  [500,'MEDIUM'],[600,'SEMI BOLD'],[700,'BOLD'],[800,'EXTRA BOLD'],[900,'BLACK']];
function weightSelect(o){
  const cur = o.wt || 400;
  /* a document written before this was a list (or by hand) can hold
     something off-list — keep it, in its sorted place, rather than
     silently restyling the text the moment its panel is opened */
  const opts = WEIGHTS.some(([v]) => v === cur) ? WEIGHTS
    : [...WEIGHTS, [cur, 'CUSTOM']].sort((a,b) => a[0] - b[0]);
  return `<select class="sel" data-wt>${opts.map(([v,n]) =>
    `<option value="${v}"${v===cur?' selected':''}>${v} · ${n}</option>`).join('')}</select>`;
}
/* two numeric fields sharing one row — the same layout already used for

   plain-width first label, a fixed-width right-aligned second label so
   the input columns line up down the panel. w2 is that second label's
   width in px — pick it to fit the label (26 for short ones like ROT,
   more for longer ones like OPACITY). */
function num2(lb1, k1, v1, lb2, k2, v2, w2, u1='', u2=''){
  return `<div class="r"><span class="lb">${lb1}</span><input class="n" data-k="${k1}" value="${v1}">${u1?`<span class="u">${u1}</span>`:''}
    <span class="lb" style="width:${w2}px;text-align:right">${lb2}</span><input class="n" data-k="${k2}" value="${v2}">${u2?`<span class="u">${u2}</span>`:''}</div>`;
}
/* the ON/OFF toggle look already used for SNAP/SHOW — a label plus a
   button styled like a number input, showing the current state as text
   rather than a checked/unchecked icon */
function toggleRow(lb, dataAttr, on, w){
  const style = w ? ` style="width:${w}px"` : '';
  return `<div class="r"><span class="lb"${style}>${lb}</span><button class="n" style="width:auto;padding:3px 10px;cursor:pointer" ${dataAttr}>${on?'ON':'OFF'}</button></div>`;
}
/* two independent stacked columns side by side, each its own list of rows

  return `<div style="display:flex;gap:14px">

/* section heading: label (with an optional "?" help bubble that replaces

function secHead(label, help='', right=''){

/* a group has no fill/type-specific geometry of its own — just its box,

function groupPanel(o){

/* an image has no palette fill either — just its box, rotation, and a

function imagePanel(o){
  return `
  <div class="sec">
    ${secHead('image', 'pixels from the top-left · <b>⌥</b> or <b>ctrl</b> to bypass snapping', `<em>#${o.id}</em>`)}
    ${num2('X','x',Math.round(o.x), 'Y','y',Math.round(o.y), 50)}

let tab = 'artboard';

   whenever the selection holds one. Note this asks about parentage rather

   selection, so a child stays selectable with `entered` already null. */
const selInGroup = () => selectedObjs().some(o => parentGroupOf(o.id) !== null);

  const canAdd = groups.length === 1 && loose.length > 0;
  if(!inGroup.length && !canAdd) return '';
  return `<div class="sec">
    ${secHead('Group', canAdd
      ? 'the loose objects join the selected group, keeping exactly where they sit on the artboard'
      : 'the objects leave their group and land just above it in the stack, keeping where they sit',
      canAdd ? `<em>${loose.length} joining</em>` : `<em>${inGroup.length} inside</em>`)}

      ${canAdd ? `<button class="alb" id="addToGroup" style="width:auto;padding:5px 10px">⌘G ADD TO GROUP</button>` : ''}
      ${inGroup.length ? `<button class="alb" id="outOfGroup" style="width:auto;padding:5px 10px">MOVE OUT</button>` : ''}

/* offered for any selection at all, unlike Distribute — a single object

const CLAMP = { docw:[80,12000], doch:[80,12000], cols:[1,96], rows:[1,96], gap:[0,600], margin:[0,2000] };
/* Document fields route by key, never by "is anything selected" — the
   Artboard tab stays reachable while an object is selected, and the
   object has its own w/h. */
const DOCK = { docw:'w', doch:'h', cols:'cols', rows:'rows', gap:'gap', margin:'margin' };

/* ── numeric fields ──────────────────────────────────────────────────
   One delegated controller rather than listeners per input: the panel is
   rebuilt constantly, so per-input handlers die mid-gesture and leak.
   A press is a click until the pointer travels — below the threshold the
   field focuses and you type, above it we blur and scrub.               */
function fieldGet(k){
  if(DOCK[k]) return doc[DOCK[k]] ?? 0;
  const o = cur();
  if(!o) return 0;
  if(k === 'gang' || k === 'goff' || k === 'glen'){
    if(!isGrad(o.fill)) return 0;
    const g = parseGrad(o.fill);
    return k === 'gang' ? g.ang : k === 'goff' ? g.off : g.len;
  }
  if(k === 'op') return o.op ?? 100;
  if(IMGFX.includes(k)) return o[k] ?? 100;   /* an untouched image carries no key at all */
  return Math.round((o[k] ?? 0) * 100) / 100;
}
function fieldSet(k, v){
  if(DOCK[k]){
    const [lo,hi] = CLAMP[k] || [0,9999];
    doc[DOCK[k]] = Math.max(lo, Math.min(hi, Math.round(v)));
    dirty = true; return;
  }
  const o = cur();
  if(!o) return;
  if(k === 'gang' || k === 'goff' || k === 'glen'){
    if(isGrad(o.fill)){
      const g = parseGrad(o.fill);
      o.fill = k === 'gang' ? mkGrad(v, g.a, g.b, g.off, g.len)
        : k === 'goff' ? mkGrad(g.ang, g.a, g.b, v, g.len)
        : mkGrad(g.ang, g.a, g.b, g.off, v);
    }
    dirty = true; return;
  }
  if(k === 'x' || k === 'y')      o[k] = Math.round(v*100)/100;
  else if(k === 'w' || k === 'h'){
    const nv = Math.max(1, Math.round(v));
    if(o.lockAspect && o.w > 0 && o.h > 0){
      const ratio = o.w / o.h;                  /* whatever the shape's current proportions are */
      if(k === 'w'){ o.w = nv; o.h = Math.max(1, Math.round(nv / ratio)); }
      else         { o.h = nv; o.w = Math.max(1, Math.round(nv * ratio)); }
    } else o[k] = nv;
  }
  else if(k === 'sw')             o.sw  = Math.max(1, Math.round(v));
  else if(k === 'op')             o.op  = Math.max(0, Math.min(100, Math.round(v)));
  /* 0 is a black frame / no contrast at all, 200 is twice the original —
     past that an image is a solid colour and the field stops being useful */
  else if(IMGFX.includes(k))      o[k]  = Math.max(0, Math.min(200, Math.round(v)));
  else if(k === 'rx')             o.rx  = Math.max(0, Math.round(v));
  else if(k === 'size')           o.size = Math.max(1, Math.round(v));
  else if(k === 'lh')             o.lh   = Math.max(0, Math.round(v));   /* 0 = auto */
  else o[k] = Math.round(v);                                            /* rot, wt, tr */
  dirty = true;
}

let scrub = null;
document.addEventListener('pointerdown', e => {

/* rotate point p around centre c by deg degrees */
function rotP(p, c, deg){
  const a = deg*Math.PI/180, dx = p.x-c.x, dy = p.y-c.y;
  return { x: c.x + dx*Math.cos(a) - dy*Math.sin(a), y: c.y + dx*Math.sin(a) + dy*Math.cos(a) };

       exits isolation on its own, only Escape or clicking a genuinely
       different object does (see the branch below and the stage-margin

  } else {                                   /* scale */
    let q = unrot(localPoint(p), o);

       box — a rotated corner has no meaning against document-space lines */

      const s = Math.max(Math.abs(q.x - ax) / drag.b.w, Math.abs(q.y - ay) / drag.b.h);

const endDrag = () => {
  if(!drag) return;
  if(drag.mode === 'pan'){ document.body.classList.remove('panning'); drag = null; return; }
  if(drag.mode === 'marquee'){ $('#marquee').innerHTML = ''; drag = null; panel(); return; }
  if(drag.mode === 'guide'){
    const g = guides(), v = g[drag.axis][drag.index];
    const limit = drag.axis === 'v' ? doc.w : doc.h;
    if(v < 0 || v > limit){ g[drag.axis].splice(drag.index, 1); flash('guide removed'); }
  }

/* keep panel numbers live without rebuilding it mid-drag */

/* ════════════════════════════════════════════════════════════════════
   OBJECTS
   ═══════════════════════════════════════════════════════════════════ */
function add(type){
  commit();
  /* land at the top-left margin, a third of the artboard across */
  const m = doc.margin||0, w = Math.round(doc.w/3), h = Math.round(doc.h/3);
  const base = { id: nextId(), x:m, y:m, w, h, rot:0, fill:defaultFill(), lockAspect:true };
  const fs = Math.round(doc.h/12);
  const o =
    type === 'text'     ? {...base, type:'text', y:m+fs, str:'TYPE HERE', font:'Poppins', size:fs,
                           tr:0, wt:500, lh:0, al:'l'}
  : type === 'half'     ? {...base, type:'half', h: Math.round(doc.h/6)}
  : type === 'ellipse'  ? {...base, type:'ellipse'}
  : type === 'triangle' ? {...base, type:'triangle'}
  : type === 'line'     ? {...base, type:'line', h: 0, sw: Math.max(1, Math.round(doc.w/240))}

  reader.onload = () => {
    const src = reader.result, img = new Image();
    img.onload = () => {
      commit();
      const m = doc.margin||0;
      const w = Math.min(Math.round(doc.w/2), img.naturalWidth || doc.w/2);
      const h = Math.round(w * ((img.naturalHeight || 1) / (img.naturalWidth || 1)));
      const o = { id: nextId(), type:'image', x:m, y:m, w, h: h || w, rot:0, src, lockAspect:true };

    };

  if(o.type === 'group') c.children = o.children.map(ch => ({ ...ch, id: freshId() }));
  return c;
}
function dup(){
  const objs = selectedObjs(); if(!objs.length) return; commit();
  const off = Math.round(Math.max(doc.w,doc.h)/40), list = activeList();
  sel = objs.map(o => { const c = cloneObj(o, off, off); list.push(c); return c.id; });

}

    return flash(child.type === 'image' ? "an image has no outline to cut with — mask with a shape or some text"

function localToDoc(p, g, cb, s){

function docToLocal(p, g){

/* ── group membership ────────────────────────────────────────────────

   a list change: a child's x/y/w/h/rot live in its group's local frame,
   the document's objects live in the document's. Every move here goes
   through document space — bakeChild() lifts a child out of its group's
   frame, regroup() re-derives the frame around whatever's left — so
   nothing shifts on screen when membership changes.

   groupSel does. Because bakeChild has already folded the group's own
   rotation and scale into each child, resetting them to identity here is

   applied since its last membership change. */

/* Align measures every selected object against one reference rectangle, and
   which rectangle that is, is the user's choice (alignRef):

     SELECTION  the selection's own bounding box. Purely relative, so it
                needs no entered-group guard — whatever frame the selection's
                ids live in, they all share it (see selectedObjs()'s comment
                on the selection-homogeneity invariant). Meaningless on a
                single object, which is already its own bounding box.
     ARTBOARD   the document rectangle. Absolute, so — like centre()/snapSel()
                below — it can't run on a child of an entered group, whose
                x/y live in that group's local frame, not the document's.
                Works on any number of objects, one included.

   you put things, it doesn't redefine the edges. */
function alignSel(mode, ref = alignRefFor()){
  const objs = selectedObjs();
  if(!objs.length) return flash('select something first');
  if(ref === 'selection' && objs.length < 2) return flash('select at least 2 objects to align to each other');
  if(ref === 'artboard' && (entered !== null || selInGroup()))
    return flash("can't align to the artboard — that's inside a group");
  commit();
  const boxes = objs.map(o => ({ o, b: localBox(o) }));
  const f = ref === 'artboard' ? { x:0, y:0, w:doc.w, h:doc.h } : bboxOf(objs);
  const x0 = f.x, x1 = f.x + f.w, y0 = f.y, y1 = f.y + f.h;
  boxes.forEach(({o,b}) => {
    if(mode === 'left')         setPos(o, o.x + (x0 - b.x), o.y);
    else if(mode === 'right')   setPos(o, o.x + (x1 - (b.x+b.w)), o.y);
    else if(mode === 'centerX') setPos(o, o.x + ((x0+x1)/2 - (b.x+b.w/2)), o.y);
    else if(mode === 'top')     setPos(o, o.x, o.y + (y0 - b.y));
    else if(mode === 'bottom')  setPos(o, o.x, o.y + (y1 - (b.y+b.h)));
    else if(mode === 'centerY') setPos(o, o.x, o.y + ((y0+y1)/2 - (b.y+b.h/2)));

/* equalise the gaps between bounding boxes along one axis, sorted by
   position — the first and last objects anchor the span, only the ones
   between them move (the standard "distribute spacing" behaviour) */
function distributeSel(axis){
  const objs = selectedObjs(); if(objs.length < 3) return flash('select at least 3 objects');
  commit();
  const k = axis === 'x' ? 'x' : 'y', d = axis === 'x' ? 'w' : 'h';
  const boxes = objs.map(o => ({ o, b: localBox(o) })).sort((p,q) => p.b[k] - q.b[k]);
  const first = boxes[0].b, last = boxes[boxes.length-1].b;
  const span = (last[k]+last[d]) - first[k];
  const used = boxes.reduce((s,{b}) => s + b[d], 0);
  const gap = (span - used) / (boxes.length - 1);
  let cursor = first[k] + first[d];
  for(let i = 1; i < boxes.length-1; i++){
    const {o,b} = boxes[i], target = cursor + gap;
    if(axis === 'x') setPos(o, o.x + (target - b.x), o.y);
    else              setPos(o, o.x, o.y + (target - b.y));

}
/* centring is just the artboard reference on the centre axis — one formula,
   and it picked up multi-selection support for free on the way */
const centre = axis => alignSel(axis === 'x' ? 'centerX' : 'centerY', 'artboard');
/* these three position a single object against the *document's* edges/grid/
   guides — meaningless for a child of an entered group, whose x/y live in
   the group's own local frame, not the document's */
function guidesFromSel(){
  const o = cur(); if(!o) return flash('select something first');
  if(entered !== null) return flash("can't add guides — you're inside a group");
  commit();
  const b = localBox(o), g = guides();
  [b.x, b.x + b.w].forEach(x => { if(!g.v.includes(Math.round(x))) g.v.push(Math.round(x)); });
  [b.y, b.y + b.h].forEach(y => { if(!g.h.includes(Math.round(y))) g.h.push(Math.round(y)); });
  touch(); flash('guides added on all four edges');
}
function snapSel(){
  const o = cur(); if(!o) return; if(entered !== null) return flash("can't snap — you're inside a group");
  commit();
  const b = localBox(o), nx = nearest(snapLinesV(), b.x), ny = nearest(snapLinesH(), b.y);
  setPos(o, o.x + (nx - b.x), o.y + (ny - b.y)); touch(); }
function rot90(){ const o = cur(); if(!o) return; commit(); o.rot = ((o.rot||0) + 90) % 360; touch(); }
function resetRot(){ const o = cur(); if(!o) return; commit(); o.rot = 0; touch(); }
function fitWidth(){
  const o = cur(); if(!o || o.type === 'text') return;
  if(entered !== null) return flash("can't fit — you're inside a group");

function addSwatch(){
  commit();

function renameSwatch(oldId, raw){
  const id = raw.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(!id || id === oldId) return full();
  if(doc.palette.some(p => p.id === id)) return flash('a swatch named ' + id + ' already exists'), full();
  commit();
  doc.palette.find(p => p.id === oldId).id = id;
  allObjects().forEach(o => {                       // keep every reference pointing home
    if(isGrad(o.fill)){
      const g = parseGrad(o.fill);
      if(g.a === oldId || g.b === oldId) o.fill = mkGrad(g.ang, g.a === oldId ? id : g.a, g.b === oldId ? id : g.b, g.off, g.len);
    } else if(fillSlot(o.fill) === oldId){
      const p = fillPct(o.fill);
      o.fill = id + (p < 100 ? '@' + p : '');
    }
    if(o.grad && isGrad(o.grad)){                    // ...including a gradient parked while in solid mode
      const g = parseGrad(o.grad);
      if(g.a === oldId || g.b === oldId) o.grad = mkGrad(g.ang, g.a === oldId ? id : g.a, g.b === oldId ? id : g.b, g.off, g.len);

function delSwatch(id){
  if(doc.palette[0] && doc.palette[0].id === id) return flash('the first swatch is the background — it can’t be removed');
  if(doc.palette.length <= 2) return flash('keep at least two swatches');
  if(allObjects().some(o => objRefs(o).includes(id))) return flash(id + ' is in use — recolour those objects first');
  commit();
  doc.palette = doc.palette.filter(p => p.id !== id);
  touch();

/* ════════════════════════════════════════════════════════════════════
   SAVE — the DOM is the file
   ═══════════════════════════════════════════════════════════════════ */
function serialize(){
  $('#doc-data').textContent = '\n' + JSON.stringify(doc, null, 1) + '\n';
  renderSVG();
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#handles').innerHTML = '';
  /* zoom/pan are how *you* are looking at the artboard right now, not
     part of the document — a plakt you send someone should open framed.
     Stripping them also keeps --zoom (which the overlay chrome divides
     its widths by, see .gd) in step with the JS `zoom`, which always
     boots at 1: a baked-in --zoom would leave the two disagreeing and
     every handle and hairline mis-sized on open. --ar stays; that one
     is the artboard's real shape. */
  const bd = c.querySelector('#board');
  ['--zoom','--panx','--pany','transform-origin'].forEach(p => bd.style.removeProperty(p));
  c.querySelector('body').className = document.body.classList.contains('grid') ? 'grid' : '';
  c.querySelector('#panel').innerHTML = '';
  c.querySelector('#cmdlist').innerHTML = '';
  c.querySelector('#cmdk').classList.remove('open');
  c.querySelector('#cmdin').setAttribute('value','');
  /* a document someone else's JSON was pasted into shouldn't ship with
     that JSON, or with the dialog hanging open on load */
  c.querySelector('#jsonk').classList.remove('open');
  c.querySelector('#jsonin').textContent = '';
  /* the versions menu is built from this browser's local storage on open —
     stale rows have no business travelling inside the file */
  c.querySelector('#verMenu').classList.remove('open');
  c.querySelector('#verMenu').innerHTML = '';
  c.querySelector('#verMenuBtn').classList.remove('open');
  c.querySelector('title').textContent = doc.name;
  return '<!DOCTYPE html>\n' + c.outerHTML + '\n';
}
const slug = () => doc.name.replace(/[^\w-]+/g,'-').toLowerCase();

async function save(){
  const html = serialize();
  if(CAN_WRITE){
    try{
      if(!handle) handle = await showSaveFilePicker({
        suggestedName: slug() + '.html',
        types:[{description:'Plakt', accept:{'text/html':['.html']}}]
      });
      const w = await handle.createWritable();
      await w.write(html); await w.close();
      doc.name = handle.name.replace(/\.html$/,'');
      dirty = false; captureVersion(); status(); flash('written back into ' + handle.name);
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
      flash('could not write back — downloading instead');
    }
  }
  download(html, slug() + '.html', 'text/html');
  dirty = false; captureVersion(); status();
}
/* opening a file via the OS (double-click, drag onto the browser) gives the
   page no way to write back to it — the File System Access API only ever
   hands out a writable handle through an explicit picker call, as a
   deliberate security boundary. So "open" is its own action here: pick a
   plakt file through the same picker save() uses, load its doc straight
   into the already-running app, and keep the handle so every save() from
   then on writes back into that exact file with no dialog at all. */
async function openFile(){
  if(!CAN_WRITE) return flash("this browser can't write files directly — open the file itself instead of using ⌘O");
  try{
    const [h] = await showOpenFilePicker({
      types:[{description:'Plakt', accept:{'text/html':['.html']}}]
    });
    const text = await (await h.getFile()).text();
    const m = text.match(/<script type="application\/json" id="doc-data">([\s\S]*?)<\/script>/);
    if(!m) throw new Error('not a plakt file');
    doc = JSON.parse(m[1]);
    handle = h; sel = []; entered = null; undoS = []; redoS = []; dirty = false;
    resetView();
    touch();
    flash('opened ' + h.name + ' — ⌘S now saves back into it');
  }catch(err){
    if(err.name === 'AbortError') return;
    flash('could not open that file — is it a plakt export?');
  }
}
/* writes a duplicate file without touching what save() targets — the
   currently-open file (its handle, its name) stays exactly what it was,
   so ⌘S right after this still goes back into the original, not the copy */
async function saveAsCopy(){
  const html = serialize();

    try{
      const h = await showSaveFilePicker({
        suggestedName: slug() + '-copy.html',
        types:[{description:'Plakt', accept:{'text/html':['.html']}}]
      });
      const w = await h.createWritable();
      await w.write(html); await w.close();
      captureVersion(); flash('saved a copy to ' + h.name);
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
      flash('could not write a copy — downloading instead');
    }

}
/* JSON, not SVG, is the source format for replacing a document: it's
   exactly doc's own shape (the same thing already embedded as doc-data in
   every saved file), so loading it back is a plain JSON.parse with no
   interpretation needed. An exported SVG is lossy in the other direction
   — rotation is baked into a transform, fills are resolved to flat hex,
   text is baked into <tspan>s — there's no reliable way back from that
   into doc's model, so SVG stays an export-only format.
   Both ways in land in the same dialog: a file you pick is read into the
   textarea rather than applied on the spot, so pasted and opened JSON
   follow one code path and you get to see what you are about to replace
   your document with before it happens. */
function replaceFromJSON(){
  $('#jsonk').classList.add('open');
  $('#jsonin').value = ''; jsonSource = 'pasted JSON';
  $('#jsonin').focus();
}
function jsonClose(){ $('#jsonk').classList.remove('open'); $('#jsonin').value = ''; }
/* what the confirmation message calls whatever is in the textarea — a

let jsonSource = 'pasted JSON';
/* returns false and leaves the dialog open on anything it won't take, so

function applyJSON(text, source){
  let loaded;

  catch(e){ flash(text.trim() ? 'not valid JSON' : 'nothing to replace from'); return false; }
  if(!loaded || !Array.isArray(loaded.objects) || !Array.isArray(loaded.palette)){
    flash("that JSON doesn't look like a plakt document"); return false;
  }
  commit();

function loadJSONFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {

       on its own) still means "replace from this" — show it first */

async function copyToClipboard(text, kind, ext, type){

const copyJSON    = () => copyToClipboard(JSON.stringify(doc, null, 1), 'JSON', '.json', 'application/json');
const copySVGText = () => copyToClipboard(standaloneSVG(), 'SVG', '.svg', 'image/svg+xml');
/* a blank document, not just an empty artboard — palette, grid, guides

function newDoc(){

/* ════════════════════════════════════════════════════════════════════
   VERSIONS — snapshots kept in this browser's local storage only. They
   never touch a file and never leave the machine; unlike undo/redo (which
   resets on reload) these survive closing the tab, so they're for "I want
   to come back to this exact state later," not for undoing a mistake.
   Scoped per document name — plakt.html has no other durable identity for
   "which document is this" across a reload. ═══════════════════════════ */
const VERSION_CAP = 50;
const VERSION_DEBOUNCE = 3000;   /* ms of inactivity before an edit-in-progress settles into a version */
const versionsKey = () => 'plakt:versions:' + slug();
function listVersions(){
  try{
    const list = JSON.parse(localStorage.getItem(versionsKey()) || '[]');
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
/* Every snapshot carries a whole copy of the document, images and all, and
   an embedded photo is measured in hundreds of KB against a storage quota
   of a few MB. VERSION_CAP alone can't bound that — 50 snapshots of an
   illustrated document overflow long before the cap is reached, and once
   the quota is hit *nothing* saves again: every later edit is lost on the
   next reload, however long you wait.

   So the cap is a ceiling, not a promise. When the write won't fit, drop
   the oldest snapshots and retry until it does. History is the thing that
   can be spared here; the newest state is not. */
function saveVersionsList(list){
  const l = [...list];               /* newest first, so pop() sheds the oldest */
  for(;;){
    try{
      localStorage.setItem(versionsKey(), JSON.stringify(l));
      if(l.length < list.length)
        flash(`local storage full — keeping the newest ${l.length} version${l.length === 1 ? '' : 's'}`);
      return true;
    }catch(e){
      if(!l.length) break;           /* an empty list is the last thing to try —
                                        deleting every version must still write */
      l.pop();
    }
  }
  /* not even one snapshot fits, so this document can't be auto-restored at
     all. Say so plainly: the file itself is the only place it's safe. */
  flash('document too large for local versions — save it to a file (⌘S)');
  return false;
}
/* called automatically — via touch()'s debounce on every edit, and
   immediately from save()/saveAsCopy() — no manual "save version" button
   exists. Never calls flash() itself, and only does a full panel()
   rebuild when the Versions tab is the one actually showing (it has no
   focusable fields to disrupt there); any other tab just gets its badge
   patched in place, so a full rebuild never steals focus from a field
   the user is mid-edit in. Whichever path runs, it happens before any
   caller's own flash() (see save()), so nothing here can stomp it. */
function captureVersion(){
  /* an explicit capture (save) preempts a pending debounced one, so they
     can't fire back-to-back on the same change. Nulling it — not just
     clearing — is what lets flushVersion() tell "a capture is pending"
     from "the last one already ran". */
  clearTimeout(versionTimer); versionTimer = null;
  const list = listVersions();
  list.unshift({ id: Date.now(), ts: Date.now(), objects: doc.objects.length, doc: JSON.parse(JSON.stringify(doc)) });
  if(list.length > VERSION_CAP) list.length = VERSION_CAP;
  if(!saveVersionsList(list)) return;
  renderVersions();
}
/* Versions live in the status bar next to SAVE rather than in the
   inspector: they are a property of the file, not of what's selected, and
   the inspector is where you work on the latter. Redrawn in place on
   every capture — the count on the button is the only thing visible when
   the menu is shut, and it has to stay honest as the debounce fires. */
function renderVersions(){
  const list = listVersions(), btn = $('#verMenuBtn'), menu = $('#verMenu');
  if(!btn || !menu) return;
  btn.innerHTML = 'VERSIONS ▾' + (list.length ? ` <em>${list.length}</em>` : '');
  menu.innerHTML =
    `<div class="vhead">kept in this browser only</div>` +
    (list.map(v => `
      <div class="vrow">
        <div class="vd">
          <span class="vdate">${formatVersionDate(v.ts)}</span>
          <span class="vmeta">${v.objects} object${v.objects===1?'':'s'}</span>
        </div>
        <div class="va">
          <button class="alb" data-restore="${v.id}" style="width:auto;padding:4px 8px" title="Replace the current document with this version — you can still undo afterward">RESTORE</button>
          <button class="verx" data-delver="${v.id}" title="Delete this version — this cannot be undone">×</button>
        </div>
      </div>`).join('')
      || '<div class="tip">no saved versions yet — one is kept a few seconds after each change settles</div>');
  $$('#verMenu [data-restore]').forEach(b => b.onclick = () => {
    verMenuSet(false); restoreVersion(+b.dataset.restore);
  });
  $$('#verMenu [data-delver]').forEach(b => b.onclick = () => {
    if(confirm('Delete this version? This cannot be undone.')) deleteVersion(+b.dataset.delver);
  });
}
function restoreVersion(id){
  const v = listVersions().find(v => v.id === id);
  if(!v) return;
  commit();                       /* undo brings the pre-restore state right back */
  doc = JSON.parse(JSON.stringify(v.doc));
  sel = []; entered = null; touch();
  flash('restored version from ' + formatVersionDate(v.ts));
}
function deleteVersion(id){
  saveVersionsList(listVersions().filter(v => v.id !== id));
  renderVersions(); flash('version deleted');
}
function formatVersionDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ' ' +
    d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
}

function download(data, name, type){
  saveURL(URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type})), name);
}
/* the anchor must be in the document — Firefox drops synthetic clicks on
   detached elements, which is why exporting silently did nothing */
function saveURL(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}
function standaloneSVG(){
  const c = svgEl.cloneNode(true);
  const g = c.querySelector('#gridlines'); if(g) g.remove();
  const gu = c.querySelector('#guides');    if(gu) gu.remove();
  const hd = c.querySelector('#handles');  if(hd) hd.remove();
  c.querySelectorAll('.mg').forEach(n => n.remove());   /* mask outlines are editor chrome */
  c.setAttribute('width', doc.w); c.setAttribute('height', doc.h);
  c.setAttribute('xmlns', NS);
  /* an SVG rasterised through an <img> is its own document — it cannot
     see the page's @font-face rules, so carry them inside */
  const src = document.getElementById('fonts');
  if(src){
    const st = document.createElementNS(NS, 'style');
    st.textContent = src.textContent;

  }

function exportSVG(){ download(standaloneSVG(), slug()+'.svg', 'image/svg+xml'); flash('exported svg'); }
async function exportPNG(scale){
  flash(`rendering @${scale}x…`);
  try{
    if(document.fonts) await document.fonts.ready;
    /* data: rather than blob: — under an opaque origin a blob-backed image
       taints the canvas and toBlob/toDataURL then throw SecurityError */
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(standaloneSVG());
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('the browser refused to rasterise the svg'));
      img.src = src;
    });
    const cv = document.createElement('canvas');
    cv.width = Math.round(doc.w*scale); cv.height = Math.round(doc.h*scale);
    const g = cv.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, cv.width, cv.height);

    let url = null;
    try{
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      if(blob) url = URL.createObjectURL(blob);
    }catch(e){ /* fall through to the data-url path */ }
    if(!url) url = cv.toDataURL('image/png');

    saveURL(url, `${slug()}@${scale}x.png`);
    flash(`exported ${cv.width}×${cv.height} png`);
  }catch(err){
    const m = (err && err.name === 'SecurityError')
      ? 'blocked by the sandbox — open the saved file directly and retry'
      : (err && err.message) || 'could not rasterise';
    flash('png export failed — ' + m);
  }
}

/* ════════════════════════════════════════════════════════════════════
   MODE / STATUS
   ═══════════════════════════════════════════════════════════════════ */
function mode(on){

}
function status(){

let ft;
function flash(m){ $('#msg').textContent = m; clearTimeout(ft); ft = setTimeout(sync, 2200); }
addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ════════════════════════════════════════════════════════════════════
   COMMANDS
   ═══════════════════════════════════════════════════════════════════ */
const CMDS = [
  {n:'Add rectangle',    k:'R',  f:()=>add('rect')},
  {n:'Add circle',       k:'C',  f:()=>add('ellipse')},
  {n:'Add half circle',  k:'H',  f:()=>add('half')},
  {n:'Add triangle',     k:'P',  f:()=>add('triangle')},
  {n:'Add line',         k:'L',  f:()=>add('line')},
  {n:'Add text',         k:'T',  f:()=>add('text')},
  {n:'Add image',        k:'I',  f:()=>$('#imgInput').click()},
  {n:'Duplicate',        k:'⌘D', f:dup},
  {n:'Group',            k:'⌘G', f:groupSel},
  {n:'Ungroup',          k:'⇧⌘G',f:ungroupSel},
  {n:'Add selection to group', k:'', f:addToGroupCmd},
  {n:'Move out of group',      k:'', f:removeFromGroupCmd},
  {n:'Copy',             k:'⌘C', f:copyCmd},
  {n:'Paste',            k:'⌘V', f:pasteCmd},
  {n:'Cut',              k:'⌘X', f:()=>{ const objs=selectedObjs(); if(!objs.length) return flash('nothing selected'); clip=clipData(objs); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(JSON.stringify(clip)).catch(()=>{}); del(); flash('cut '+objs.length+(objs.length===1?' '+objs[0].type:' objects')); }},
  {n:'Delete',           k:'⌫',  f:del},
  {n:'Rotate 90°',       k:'⇧R', f:rot90},
  {n:'Reset rotation',   k:'',   f:resetRot},
  {n:'Span full width',  k:'',   f:fitWidth},
  {n:'Centre horizontally', k:'', f:()=>centre('x')},
  {n:'Centre vertically',   k:'', f:()=>centre('y')},
  {n:'Align left',          k:'', f:()=>alignSel('left')},
  {n:'Align right',         k:'', f:()=>alignSel('right')},
  {n:'Align centre (horizontal)', k:'', f:()=>alignSel('centerX')},
  {n:'Align top',           k:'', f:()=>alignSel('top')},
  {n:'Align bottom',        k:'', f:()=>alignSel('bottom')},
  {n:'Align middle (vertical)',   k:'', f:()=>alignSel('centerY')},
  {n:'Distribute horizontally', k:'', f:()=>distributeSel('x')},
  {n:'Distribute vertically',   k:'', f:()=>distributeSel('y')},
  {n:'Snap selection to grid', k:'', f:snapSel},
  {n:'Bring forward',    k:']',  f:()=>order(1)},
  {n:'Send backward',    k:'[',  f:()=>order(-1)},
  {n:'Toggle snapping',  k:'',   f:()=>{snap=!snap;syncSnapUI();panel();flash('snapping '+(snap?'on':'off'))}},
  {n:'Toggle grid',      k:'G',  f:()=>document.body.classList.toggle('grid')},
  {n:'Guides from selection', k:'', f:guidesFromSel},
  {n:'Clear all guides', k:'',   f:()=>{ commit(); doc.guides = {v:[],h:[]}; touch(); flash('guides cleared'); }},
  {n:'Undo',             k:'⌘Z', f:undo},
  {n:'Redo',             k:'⇧⌘Z',f:redo},
  {n:'Add palette swatch', k:'', f:addSwatch},
  {n:'Rename plakt',     k:'',   f:()=>$('#fname').focus()},
  {n:'Clear artboard',   k:'',   f:()=>{commit();doc.objects=[];sel=[];entered=null;touch()}},
  {n:'Export PNG @1x',   k:'',   f:()=>exportPNG(1)},
  {n:'Export PNG @2x',   k:'',   f:()=>exportPNG(2)},
  {n:'Export PNG @4x',   k:'',   f:()=>exportPNG(4)},
  {n:'Export SVG',       k:'',   f:exportSVG},
  {n:'Save',             k:'⌘S', f:save},
  {n:'Open…',            k:'⌘O', f:openFile},
  {n:'Save as copy',     k:'',   f:saveAsCopy},
  {n:'Replace from JSON', k:'',  f:replaceFromJSON},
  {n:'Copy JSON',        k:'',   f:copyJSON},
  {n:'Copy SVG',         k:'',   f:copySVGText},
  {n:'New',              k:'',   f:newDoc},
  {n:'Reset zoom/pan',   k:'⌘0', f:resetView},
  {n:'Enter edit mode',  k:'E',  f:()=>mode(true)},
  {n:'Leave edit mode',  k:'ESC',f:()=>mode(false)}
];

/* ── command palette ─────────────────────────────────────────────── */
let ci = 0, hits = CMDS;
function cmdOpen(){ $('#cmdk').classList.add('open'); $('#cmdin').value=''; ci=0; cmdFilter(''); $('#cmdin').focus(); }
function cmdClose(){ $('#cmdk').classList.remove('open'); }
function cmdFilter(q){
  q = q.toLowerCase();
  hits = CMDS.filter(c => c.n.toLowerCase().includes(q));
  ci = Math.min(ci, Math.max(0, hits.length-1));
  $('#cmdlist').innerHTML = hits.length
    ? hits.map((c,i) => `<button class="c ${i===ci?'on':''}" data-i="${i}">${c.n}<span class="k">${c.k}</span></button>`).join('')
    : '<div class="ce">No command matches. Try “export”.</div>';
  $$('#cmdlist .c').forEach(b => b.onclick = () => { cmdClose(); hits[+b.dataset.i].f(); });
}
$('#cmdin').addEventListener('input', e => cmdFilter(e.target.value));
$('#cmdk').addEventListener('pointerdown', e => { if(e.target.id === 'cmdk') cmdClose(); });

/* ── keys ────────────────────────────────────────────────────────── */
addEventListener('keydown', e => {
  const open = $('#cmdk').classList.contains('open');
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();

  /* the JSON dialog is modal: nothing behind it should act on a key,
     including ⌘S — you are editing text, not the document */
  if($('#jsonk').classList.contains('open')){
    if(e.key === 'Escape'){ e.preventDefault(); jsonClose(); }
    return;
  }

  if(mod && k === 'k'){ e.preventDefault(); open ? cmdClose() : cmdOpen(); return; }
  if(mod && k === 's'){ e.preventDefault(); save(); return; }
  if(mod && k === 'o'){ e.preventDefault(); openFile(); return; }
  if(mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && k === 'd'){ e.preventDefault(); dup(); return; }
  if(mod && k === 'g'){ e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); return; }
  if(mod && k === '0'){ e.preventDefault(); resetView(); return; }

  if(open){
    if(e.key === 'Escape') cmdClose();
    if(e.key === 'ArrowDown'){ e.preventDefault(); ci = Math.min(ci+1, hits.length-1); cmdFilter($('#cmdin').value); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); ci = Math.max(ci-1, 0); cmdFilter($('#cmdin').value); }
    if(e.key === 'Enter' && hits[ci]){ cmdClose(); hits[ci].f(); }
    return;
  }
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(mod) return;                 /* any other ⌘/ctrl combo (copy, paste…) is the browser's */

  const edit = document.body.classList.contains('edit');
  if(k === 'e' && !edit){ mode(true); return; }
  if(e.key === 'Escape'){
    if(entered !== null){ enter(null); marks(); panel(); }
    else if(sel.length){ sel = []; marks(); panel(); }
    else mode(false);
    return;
  }
  if(!edit) return;

  if(e.shiftKey && k === 'r'){ rot90(); return; }
  const keys = {r:'rect', c:'ellipse', h:'half', t:'text', p:'triangle', l:'line'};
  if(keys[k]){ add(keys[k]); return; }
  if(k === 'i'){ $('#imgInput').click(); return; }
  if(k === 'g'){ document.body.classList.toggle('grid'); return; }
  if(e.key === ']'){ order(1); return; }
  if(e.key === '['){ order(-1); return; }
  if(e.key === 'Backspace' || e.key === 'Delete'){ e.preventDefault(); del(); return; }

  if(e.key.startsWith('Arrow') && sel.length){
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;   /* ⇧ nudges by 10px */
    const d = e.key === 'ArrowLeft' ? [-1,0] : e.key === 'ArrowRight' ? [1,0]
            : e.key === 'ArrowUp' ? [0,-1] : [0,1];
    commit();
    selectedObjs().forEach(o => { o.x += d[0]*step; o.y += d[1]*step; });
    touch();
  }
});

/* ── wiring ──────────────────────────────────────────────────────── */
$$('.tl[data-add]').forEach(b => b.onclick = () => add(b.dataset.add));
$('#t-image').onclick = () => $('#imgInput').click();
$('#imgInput').onchange = () => { addImage($('#imgInput').files[0]); $('#imgInput').value = ''; };
$('#t-view').onclick = () => mode(false);
$('#editBtn').onclick = () => mode(true);
$('#t-undo').onclick = undo;
$('#t-snap').onclick = () => { snap = !snap; syncSnapUI(); panel(); };
/* ── artboard name, clickable right in the status bar ───────────────
   a static top-level input, unlike the panel's own #docname field which
   gets rebuilt on every panel() call — wired once here instead */
$('#fname').addEventListener('focus', () => $('#fname').select());
$('#fname').addEventListener('change', () => { commit(); doc.name = $('#fname').value.trim() || 'untitled'; touch(); });
$('#fname').addEventListener('keydown', e => { if(e.key === 'Enter') $('#fname').blur(); });
/* ── file menu ───────────────────────────────────────────────────── */
/* two menus hang off the same bar, so opening either shuts the other —
   the `if(open)` guard is what keeps them from calling each other round
   in a circle */
const fileMenuSet = open => {
  if(open) verMenuSet(false);
  $('#fileMenu').classList.toggle('open', open);
  $('#fileMenuBtn').classList.toggle('open', open);
};
const verMenuSet = open => {
  if(open){ fileMenuSet(false); renderVersions(); }   /* built fresh each time it's opened */
  $('#verMenu').classList.toggle('open', open);
  $('#verMenuBtn').classList.toggle('open', open);
};
$('#fileMenuBtn').onclick = e => { e.stopPropagation(); fileMenuSet(!$('#fileMenu').classList.contains('open')); };
$('#verMenuBtn').onclick = e => { e.stopPropagation(); verMenuSet(!$('#verMenu').classList.contains('open')); };
document.addEventListener('click', e => {
  /* isConnected first: a handler inside a menu can rebuild that menu
     before the click finishes bubbling up here (deleting a version does
     exactly that), and closest() on the now-detached node walks an
     orphaned tree that never reaches .fmwrap — which would read as a
     click outside and shut the menu the user is still working in */
  if(!e.target.isConnected || e.target.closest('.fmwrap')) return;
  fileMenuSet(false); verMenuSet(false);
});
const FILE_MENU_ACTIONS = {
  save: save, open: openFile, saveCopy: saveAsCopy, replace: replaceFromJSON,
  copyJson: copyJSON, copySvg: copySVGText, new: newDoc,
  exportSvg: exportSVG, exportPng1: () => exportPNG(1), exportPng2: () => exportPNG(2), exportPng4: () => exportPNG(4)
};
$$('#fileMenu [data-fm]').forEach(b => b.onclick = () => { fileMenuSet(false); FILE_MENU_ACTIONS[b.dataset.fm](); });
$('#jsonInput').onchange = () => { loadJSONFile($('#jsonInput').files[0]); $('#jsonInput').value = ''; };
$('#jsonPick').onclick = () => $('#jsonInput').click();
$('#jsonCancel').onclick = jsonClose;
$('#jsonOk').onclick = () => { if(applyJSON($('#jsonin').value, jsonSource)) jsonClose(); };
/* typing in the textarea is the user's own JSON, not a filename any more */
$('#jsonin').addEventListener('input', () => { jsonSource = 'pasted JSON'; });
$('#jsonk').addEventListener('pointerdown', e => { if(e.target.id === 'jsonk') jsonClose(); });
$('#jsonin').addEventListener('keydown', e => {
  /* ⌘/⌃+Enter submits — plain Enter has to stay a newline inside JSON */
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); $('#jsonOk').click(); }
});
$('#stage').addEventListener('dblclick', () => { if(!document.body.classList.contains('edit')) mode(true); });
/* click the stage margin — anywhere off the artboard — to clear the selection */
$('#stage').addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('edit') || e.target.closest('#board')) return;
  if(sel.length || entered !== null){ sel = []; enter(null); marks(); panel(); }
});
/* ── zoom + pan ──────────────────────────────────────────────────────
   ⌃/⌘ + scroll zooms the artboard in place. A trackpad pinch is reported
   by every browser as a wheel event with ctrlKey set, regardless of OS,
   so this one check also covers Mac trackpad pinch-to-zoom for free.
   transform-origin tracks the cursor so the point under it stays put.
   Plain scroll pans — deltaX/deltaY straight through, which also covers
   shift+wheel on a vertical-only mouse: browsers already remap that to
   deltaX before the event reaches us. Holding Space and dragging pans
   too, for anyone without a wheel/trackpad handy — the classic "hand
   tool". */
/* 32x is close-enough-to-count-pixels on a 1200px artboard — roughly one
   document unit per 15 screen px. Going further stops being useful: the
   overlay chrome is held at a fixed screen size (see hUnit) so at some
   point the handles are larger than what they are framing. */
const ZOOM_MIN = .2, ZOOM_MAX = 32;
function setZoom(z, cx, cy){
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  const board = $('#board');
  if(cx !== undefined){
    const r = board.getBoundingClientRect();
    board.style.transformOrigin = `${(cx-r.left)/r.width*100}% ${(cy-r.top)/r.height*100}%`;
  }
  board.style.setProperty('--zoom', zoom);
  /* stroke widths track --zoom on their own through calc(), but handle
     geometry is baked into the markup by marks() — redraw it so the
     handles resize with the new zoom instead of at the old one's scale */
  marks();
  applyPan();       /* zooming about the cursor walks the board — re-clamp where it landed */
}

/* Keep the artboard reachable. Panning far enough, or zooming repeatedly
   near an edge (each zoom re-pins transform-origin to the cursor, which
   walks the board across the stage), used to leave it entirely off
   screen with nothing left to grab and no way back but ⌘0. So after
   every view change, if less than KEEP px of the board still overlaps
   the visible canvas, slide it back until that much does. Measuring the
   rendered rect rather than deriving it from zoom/pan is what keeps this
   honest: transform-origin, the board's own responsive height and the
   stage padding all feed into where it actually is. */
const KEEP = 90;
function clampPan(){
  const b = $('#board').getBoundingClientRect(), st = $('#stage');
  const s = st.getBoundingClientRect(), p = getComputedStyle(st);
  /* the stage spans the whole window; its padding is what the rail and
     the inspector cover, so the content box is the part you can see */
  const l = s.left + parseFloat(p.paddingLeft),  r = s.right  - parseFloat(p.paddingRight);
  const t = s.top  + parseFloat(p.paddingTop),   bo = s.bottom - parseFloat(p.paddingBottom);
  /* a board smaller than KEEP can never satisfy it — ask for all of it */
  const kx = Math.min(KEEP, b.width), ky = Math.min(KEEP, b.height);
  const x0 = panX, y0 = panY;
  if(b.right < l + kx)      panX += l + kx - b.right;
  else if(b.left > r - kx)  panX += r - kx - b.left;
  if(b.bottom < t + ky)     panY += t + ky - b.bottom;
  else if(b.top > bo - ky)  panY += bo - ky - b.top;
  return panX !== x0 || panY !== y0;
}
function applyPan(){
  const put = () => {
    $('#board').style.setProperty('--panx', panX + 'px');
    $('#board').style.setProperty('--pany', panY + 'px');
  };
  put();
  if(clampPan()) put();   /* clampPan measures the board where put() just left it */
}
function resetView(){
  $('#board').style.transformOrigin = '';
  panX = 0; panY = 0; applyPan();
  setZoom(1);
}
/* a window small enough can strand a board that was fine a moment ago */
addEventListener('resize', applyPan);
$('#stage').addEventListener('wheel', e => {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){ setZoom(zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY); return; }
  panX -= e.deltaX; panY -= e.deltaY;
  applyPan();
}, {passive:false});
addEventListener('keydown', e => {
  if(e.key !== ' ' || spaceDown || ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  spaceDown = true; document.body.classList.add('space');
});
addEventListener('keyup', e => {
  if(e.key !== ' ') return;
  spaceDown = false; document.body.classList.remove('space');
});
/* capture on window, not #stage: a capturing listener on #stage itself
   isn't guaranteed to run before #stage's own bubble-phase listener when
   #stage is the direct target (e.g. a click on the empty margin) — an
   ancestor's capture phase always precedes a descendant's, unambiguously */
addEventListener('pointerdown', e => {
  if(!spaceDown || !e.target.closest('#stage')) return;
  e.preventDefault(); e.stopPropagation();
  drag = { mode:'pan', px0:e.clientX, py0:e.clientY, x0:panX, y0:panY, moved:false };
  document.body.classList.add('panning');
}, {capture:true});
$('#ver').textContent = VERSION;
addEventListener('resize', marks);
if(document.fonts) document.fonts.ready.then(renderSVG);

/* the file only reflects the last explicit Save, but versions capture
   every settled edit (see touch()'s debounce) — if the newest local
   version for this doc differs from what's baked into the file, that
   version is the truer "where I left off," so resume from it instead.
   Comparing JSON rather than unconditionally swapping means a clean
   save-then-reopen (the common case) doesn't flash a pointless message
   or mark the doc dirty for no reason. */
const bootDocJSON = JSON.stringify(doc);
const lastVersion = listVersions()[0];
let resumedAt = null;
if(lastVersion && JSON.stringify(lastVersion.doc) !== bootDocJSON){
  doc = lastVersion.doc;
  sel = []; entered = null; dirty = true;
  resumedAt = lastVersion.ts;
}

ensureWebfonts();

/* boot in view mode — you received a plakt, not an application */
full();
renderVersions();   /* the count on the status bar button, before anything is captured */
/* flash() has to come after full() — full() calls panel(), which calls
   sync(), which stomps #msg unconditionally, so anything flashed earlier
   in boot would vanish before it was ever visible */
if(resumedAt) flash('resumed unsaved changes from ' + formatVersionDate(resumedAt));
</script>
</body>
