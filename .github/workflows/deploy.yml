name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # stamp the tag (v1.2.3 -> 1.2.3) into the file's own version display
      - name: Set version
        run: sed -i "s/const VERSION = '[^']*';/const VERSION = '${GITHUB_REF_NAME#v}';/" plakt.html

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" plakt.html --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: plakt-html
          path: plakt.html

  deploy:
    name: deploy
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plakt-html

      # plakt.html is the whole app, no build step — it just needs to be
      # named index.html for Pages to serve it at the site's root.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp plakt.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
